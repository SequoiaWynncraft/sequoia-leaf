name: Infrastructure

# infra/ is what production should be. A pull request shows what merging it
# would change, a merge to main makes the change, and once a week a plan checks
# that nobody changed production by hand. Running it by hand on main applies
# main again, which undoes such a change.
on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml", "mise.toml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml", "mise.toml"]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Applies run one after another and are never cancelled halfway. A newer
# apply that is waiting replaces an older one that is waiting, which is fine:
# it applies main as it is now. Plans wait for the state lock instead.
concurrency:
  group: infrastructure-${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && 'apply' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  COOLIFY_ENDPOINT: https://coolify.seqwawa.com

jobs:
  plan:
    name: Plan
    if: ${{ !(github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.10.17"
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
          install_args: opentofu
      - name: Init
        # Only the OpenTofu steps get the credentials.
        env: &credentials
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_r2_endpoint: ${{ secrets.R2_ENDPOINT }}
        run: tofu -chdir=infra init -lockfile=readonly
      - name: Plan
        id: plan
        env: *credentials
        run: |
          set +e
          tofu -chdir=infra plan -no-color -lock-timeout=10m -detailed-exitcode -out=tfplan
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then exit 1; fi
          {
            echo '### What applying would change'
            echo '```'
            tofu -chdir=infra show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if production differs from main
        if: github.event_name == 'schedule' && steps.plan.outputs.exitcode == '2'
        run: |
          echo "::error::Production differs from infra/ on main. The plan above says how."
          exit 1

  apply:
    name: Apply
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.10.17"
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
          install_args: opentofu
      - name: Init
        env: *credentials
        run: tofu -chdir=infra init -lockfile=readonly
      - name: Plan
        env: *credentials
        run: |
          tofu -chdir=infra plan -no-color -lock-timeout=10m -out=tfplan
          {
            echo '### What this apply changes'
            echo '```'
            tofu -chdir=infra show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The plan is applied exactly as shown. A resource with prevent_destroy
      # makes the plan fail instead of destroying it.
      - name: Apply
        env: *credentials
        run: tofu -chdir=infra apply -no-color -lock-timeout=10m tfplan
