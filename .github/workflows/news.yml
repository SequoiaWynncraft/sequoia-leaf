name: News

# Each patch note a merge to main adds to the town's News tab (apps/town/src/notes.json) is posted
# to Discord, by every webhook kept as the secrets NEWS_WEBHOOK and NEWS_WEBHOOK_2. A secret that is
# not set is skipped; without either, nothing is posted. A webhook that fails does not stop the
# other from getting the notes, but fails the run. A note changed after it was posted is not posted again.
on:
  push:
    branches: [main]
    paths: [apps/town/src/notes.json]

permissions:
  contents: read

concurrency:
  group: news

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge and the main it was merged onto, to tell which notes are new.
          fetch-depth: 2
      - name: Post the new notes
        env:
          NEWS_WEBHOOK: ${{ secrets.NEWS_WEBHOOK }}
          NEWS_WEBHOOK_2: ${{ secrets.NEWS_WEBHOOK_2 }}
        run: |
          set -euo pipefail
          hooks=()
          for name in NEWS_WEBHOOK NEWS_WEBHOOK_2; do
            if [ -n "${!name:-}" ]; then hooks+=("$name"); fi
          done
          if [ "${#hooks[@]}" -eq 0 ]; then echo "No news webhook: nothing posted."; exit 0; fi
          notes=apps/town/src/notes.json
          git show "HEAD^1:$notes" > /tmp/before.json 2>/dev/null || echo '[]' > /tmp/before.json
          # The notes this merge added, oldest first, each as a Discord message.
          jq -c --slurpfile before /tmp/before.json '
            ($before[0] | map(.id)) as $had
            | map(select(.id as $id | $had | index($id) | not)) | reverse | .[]
            | {embeds: [{
                title: .title,
                url: "https://leaf.seqwawa.com/play/town/",
                description: ([(.lines // [])[]]
                  + [(.more // [])[] | "**\(.head)**\n" + ([.points[] | "- " + .] | join("\n"))]
                  | join("\n\n"))[0:4000],
                color: 16101685,
                timestamp: (.at | sub("Z$"; ":00Z"))
              }]}' "$notes" > /tmp/messages.jsonl
          failed=0
          for name in "${hooks[@]}"; do
            while read -r message; do
              if ! curl -fsS -o /dev/null -H 'Content-Type: application/json' --data "$message" "${!name}"; then
                echo "::error::$name refused a note."
                failed=1
              fi
              sleep 1
            done < /tmp/messages.jsonl
          done
          exit "$failed"
