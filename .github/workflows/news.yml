name: News

# Each patch note a merge to main adds to the town's News tab (apps/town/src/notes.json) is posted
# to Discord, by each webhook kept as the secrets NEWS_WEBHOOK and NEWS_WEBHOOK_2, each in its own
# job, so one that fails or hangs never keeps the notes from the other. A secret that is not set is
# skipped. A note changed after it was posted is not posted again.
on:
  push:
    branches: [main]
    paths: [apps/town/src/notes.json]

permissions:
  contents: read

concurrency:
  group: news

jobs:
  post:
    name: post (${{ matrix.webhook }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        webhook: [NEWS_WEBHOOK, NEWS_WEBHOOK_2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge and the main it was merged onto, to tell which notes are new.
          fetch-depth: 2
      - name: Post the new notes
        env:
          NAME: ${{ matrix.webhook }}
          WEBHOOK: ${{ secrets[matrix.webhook] }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then echo "No $NAME: nothing posted."; exit 0; fi
          notes=apps/town/src/notes.json
          git show "HEAD^1:$notes" > /tmp/before.json 2>/dev/null || echo '[]' > /tmp/before.json
          # The notes this merge added, oldest first, each as a Discord message.
          jq -c --slurpfile before /tmp/before.json '
            ($before[0] | map(.id)) as $had
            | map(select(.id as $id | $had | index($id) | not)) | reverse | .[]
            | {embeds: [{
                title: .title,
                url: "https://leaf.seqwawa.com/play/town/",
                description: ([(.lines // [])[]]
                  + [(.more // [])[] | "**\(.head)**\n" + ([.points[] | "- " + .] | join("\n"))]
                  | join("\n\n"))[0:4000],
                color: 16101685,
                timestamp: (.at | if test("T") then sub("Z$"; ":00Z") else . + "T12:00:00Z" end)
              }]}' "$notes" > /tmp/messages.jsonl
          # Every note is tried; any that fails is named, and the job fails at the end.
          failed=0
          while read -r message; do
            if ! curl -fsS --max-time 15 -o /dev/null -H 'Content-Type: application/json' --data "$message" "$WEBHOOK"; then
              echo "::error::$NAME did not take the note \"$(jq -r '.embeds[0].title' <<< "$message")\"."
              failed=1
            fi
            sleep 1
          done < /tmp/messages.jsonl
          exit "$failed"
