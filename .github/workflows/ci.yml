name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.10.17"
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
          install_args: bun node
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format
        run: bun fmt --check
      # The type-aware lint rules and the typecheck both need the Worker's
      # generated runtime types.
      - name: Generate Worker types
        run: bun run types
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun check --build
      - name: Test
        run: bun run test
