name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.10.17"
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
          install_args: bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format
        run: bun fmt --check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun check --build
      - name: Test
        run: bun run test

  # Checks that the infrastructure configuration is well-formed. It does not
  # compare it with production: that needs credentials.
  # Clients test against a copy of contracts/leaf-api-v1.json. A copy that drifts from ours tests
  # nothing true, as when the mod read GET /v1/me/events backwards. The mod is public, so this
  # compares ours with the copy on its main branch; change the mod's copy with or before ours.
  contract-copies:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the contract with Sequoia-mod's copy
        run: |
          copy="$RUNNER_TEMP/leaf-api-v1.json"
          curl --fail --silent --show-error --location --retry 3 --output "$copy" \
            https://raw.githubusercontent.com/SequoiaWynncraft/Sequoia-mod/main/src/test/resources/contracts/leaf-api-v1.json
          if ! cmp --silent contracts/leaf-api-v1.json "$copy"; then
            echo "::error file=contracts/leaf-api-v1.json::Sequoia-mod's copy differs; copy this file to its src/test/resources/contracts/"
            diff <(jq --sort-keys . contracts/leaf-api-v1.json) <(jq --sort-keys . "$copy") | head -50
            exit 1
          fi
          echo "Sequoia-mod's copy matches ($(sha256sum < contracts/leaf-api-v1.json | cut -c1-16))"

  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.10.17"
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
          install_args: opentofu
      - name: Format
        run: tofu -chdir=infra fmt -check -diff
      - name: Validate
        run: |
          tofu -chdir=infra init -backend=false -input=false -lockfile=readonly
          tofu -chdir=infra validate

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag sequoia-leaf .
      # The image's own health check asks /healthz, which reads the database.
      - name: Start it and wait until it reports healthy
        run: |
          docker run --detach --name leaf sequoia-leaf
          for _ in $(seq 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' leaf)" = healthy ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs leaf
          exit 1
