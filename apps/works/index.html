<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Two fingers zoom the yard, so the page itself does not zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>The Works</title>
    <link rel="stylesheet" href="../../packages/kit/src/kit.css" />
    <style>
      /* Only where the yard puts things; how they look is the kit's. */
      :root {
        --edge: max(calc(var(--u) * 4), env(safe-area-inset-left), env(safe-area-inset-right));
        --top: max(calc(var(--u) * 4), env(safe-area-inset-top));
        --bottom: max(calc(var(--u) * 4), env(safe-area-inset-bottom));
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        /* Past the forest there is only dusk, and the yard's picture stops where nothing more can be seen in it. */
        background: #1a1627;
        user-select: none;
        -webkit-user-select: none;
      }
      /* The yard, drawn small: the page enlarges each of its pixels to a whole number of the screen's. */
      #view {
        position: fixed;
        left: 0;
        top: 0;
        display: block;
        transform-origin: 0 0;
        image-rendering: pixelated;
        pointer-events: none;
      }
      /* The words over the yard, at the screen's own size. Every press on the yard lands here. */
      #words {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        display: block;
        touch-action: none;
      }

      /* What `?meter` shows: how the screen is keeping up, in a corner over the dock. */
      #meter {
        position: fixed;
        z-index: 20;
        right: var(--edge);
        bottom: calc(var(--bottom) + var(--dockh, 0px) + var(--handh, 0px) + var(--u) * 4);
        margin: 0;
        padding: calc(var(--u) * 2) calc(var(--u) * 3);
        pointer-events: none;
      }

      /* Along the top: the purse and the power on the left, the yard's books and the way out on the right. */
      #top {
        position: fixed;
        z-index: 5;
        top: var(--top);
        left: var(--edge);
        right: var(--edge);
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: calc(var(--u) * 3);
        pointer-events: none;
      }
      #top > * {
        pointer-events: auto;
      }
      #purse {
        display: flex;
        gap: calc(var(--u) * 6);
        padding: var(--u) calc(var(--u) * 4);
      }
      #power {
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 3);
        padding: var(--u) calc(var(--u) * 4);
        background: none;
        color: inherit;
      }
      #power .k-bar {
        width: calc(var(--u) * 34);
      }
      #power .short {
        color: var(--k-coral);
      }
      #books,
      #corner {
        display: flex;
        gap: calc(var(--u) * 3);
      }
      #books {
        margin-left: auto;
      }
      .pip {
        position: relative;
      }
      /* A count sits on the button's corner: a longer one widens outward, past the corner, and hides no more of the picture. */
      .pip[data-n]::after {
        content: attr(data-n);
        position: absolute;
        z-index: 1;
        top: calc(var(--u) * -3);
        left: calc(100% - var(--u) * 8);
        min-width: calc(var(--u) * 11);
        height: calc(var(--u) * 11);
        font: var(--f-name);
        line-height: calc(var(--u) * 11);
        text-align: center;
        color: #3b1f19;
        background: var(--k-gold-lt);
        box-shadow: 0 0 0 var(--u) var(--k-ink);
        text-shadow: none;
      }

      /* From three digits a count is set small, to stay on the corner. */
      .pip.long[data-n]::after {
        font: var(--f-small);
        line-height: calc(var(--u) * 11);
      }

      /* How many pieces are in trouble is coral: what waits to be handed over is gold. */
      .pip.bad[data-n]::after {
        color: #2b0b12;
        background: var(--k-coral);
      }

      /* The order in hand, always in view. */
      #track {
        position: fixed;
        z-index: 4;
        top: calc(var(--toph, calc(var(--top) + var(--u) * 24)) + var(--u) * 3);
        left: var(--edge);
        width: min(calc(var(--u) * 132), calc(100vw - var(--edge) * 2));
        box-sizing: border-box;
        padding: var(--u) calc(var(--u) * 3) calc(var(--u) * 2);
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 2);
        background: none;
        color: inherit;
        text-align: left;
        /* It hangs under the top bar's signs, on ropes half as long. */
        --hang: calc(var(--k-hang) / 2);
      }
      /* The line over the order's title keeps to one line: what is to hand over goes under it where both do not fit. */
      #track .k-row {
        flex-wrap: wrap;
        gap: var(--u) calc(var(--u) * 3);
      }
      #track .k-label {
        flex: 1 0 auto;
      }
      /* How many orders wait to be handed over: a tag on the small line over the title, as small as it. */
      #track .k-chip {
        min-height: calc(var(--u) * 9);
        padding-inline: calc(var(--u) * 2);
        font: var(--f-small);
      }
      /* What comes into hand next, in one line. */
      #track .then {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* A visit: in the order's place, whose yard it is; and nothing to act with. */
      #visit {
        position: fixed;
        z-index: 4;
        top: calc(var(--toph, calc(var(--top) + var(--u) * 24)) + var(--u) * 3);
        left: var(--edge);
        max-width: calc(100vw - var(--edge) * 2);
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 3);
        padding: var(--u) calc(var(--u) * 3);
      }
      #visit .who {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #visit[hidden],
      body.visiting :is(#power, #track, #study, #hand, #dock) {
        display: none;
      }
      /* The research being studied, under the order in hand: its folio, its name, and how far it has come. */
      #study {
        position: fixed;
        z-index: 4;
        top: calc(var(--trackb, 0px) + var(--u) * 2);
        left: var(--edge);
        width: min(calc(var(--u) * 132), calc(100vw - var(--edge) * 2));
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 3);
        padding: var(--u) calc(var(--u) * 3);
        background: none;
        color: inherit;
        text-align: left;
        font: var(--f-small);
      }
      #study .pic {
        flex: none;
        width: calc(var(--u) * 12);
        display: grid;
        place-items: center;
      }
      #study .name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #study .k-bar {
        flex: none;
        width: calc(var(--u) * 36);
      }

      /* goal lists: begin */
      /*
       * A goal's head and its lists (`ui/goal.ts`), laid out here and nowhere else. A list is a label
       * on a line of its own and a row for each thing: a picture in a slot of one width, the name,
       * and at the right edge what is counted. A long name wraps in its own column; nothing else moves.
       */
      .gl {
        display: flex;
        flex-direction: column;
        gap: var(--u);
        min-width: 0;
        font: var(--f-ui);
        color: var(--k-cream);
      }
      .gl-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        column-gap: calc(var(--u) * 4);
        min-height: calc(var(--u) * 16);
      }
      .gl-what {
        display: grid;
        grid-template-columns: calc(var(--u) * 16) minmax(0, 1fr);
        align-items: center;
        column-gap: calc(var(--u) * 3);
        min-width: 0;
        text-align: left;
      }
      .gl-pic {
        width: calc(var(--u) * 16);
        height: calc(var(--u) * 16);
        display: grid;
        place-items: center;
      }
      .gl-name {
        min-width: 0;
        overflow-wrap: break-word;
      }
      .gl-what.k-link:hover .gl-name {
        text-decoration: underline dotted var(--k-faint);
        text-underline-offset: calc(var(--u) * 1.5);
      }
      .gl-end {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: calc(var(--u) * 3);
      }
      .gl-end .k-bar {
        width: calc(var(--u) * 18);
      }
      .gl-n {
        min-width: calc(var(--u) * 26);
        text-align: right;
        white-space: nowrap;
      }
      .gl-note {
        white-space: nowrap;
        color: var(--k-dim);
      }
      .gl-note.lit {
        color: var(--k-leaf);
      }
      /*
       * In the corner a row is its picture, its bar and its count, with no name: the picture takes
       * its own width and the bar the rest, and the rows are spaced as the corner spaces its lines.
       * These are the measures the corner had before there were lists, to the pixel.
       */
      .gl.tight {
        gap: calc(var(--u) * 2);
      }
      .gl.tight .gl-row {
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 3);
        min-height: 0;
      }
      .gl.tight .gl-what,
      .gl.tight .gl-pic {
        display: flex;
        flex: none;
        width: auto;
        height: auto;
      }
      .gl.tight .gl-end {
        flex: 1;
      }
      .gl.tight .gl-end .k-bar {
        flex: 1;
        width: auto;
        min-width: calc(var(--u) * 16);
      }
      .gl.tight .gl-n {
        min-width: calc(var(--u) * 28);
      }
      /* A goal's head: its picture in a slot, a gap, its name; and at the right what is done with it. */
      .gh {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: calc(var(--u) * 2) calc(var(--u) * 4);
      }
      /*
       * What is at the right goes on a line under the name where the name would be left narrower than
       * this; and always for two buttons, or a place in the line and a button.
       */
      .gh-what {
        flex: 1 1 calc(var(--u) * 80);
      }
      .gh:has(> .k-row) .gh-what {
        flex-basis: 100%;
      }
      .gh-what {
        display: grid;
        grid-template-columns: calc(var(--u) * 22) minmax(0, 1fr);
        align-items: center;
        column-gap: calc(var(--u) * 4);
        min-width: 0;
        text-align: left;
      }
      .gh-pic {
        width: calc(var(--u) * 22);
        height: calc(var(--u) * 22);
        box-sizing: border-box;
      }
      .gh-name {
        min-width: 0;
        overflow-wrap: break-word;
      }
      .gh-what.k-link:hover .gh-name {
        text-decoration: underline dotted var(--k-faint);
        text-underline-offset: calc(var(--u) * 1.5);
      }
      /*
       * A goal that waits on another lies flat (the kit's `locked`), its name and picture quieter; what
       * it wants is behind a lock, quieter too, with the number wanted and no bar.
       */
      .goal.locked .gh-what,
      .gl-row.locked .gl-what {
        opacity: 0.7;
      }
      /* On a phone, in a panel, a row is tall enough for a finger. */
      @media (max-width: 760px), (orientation: portrait) {
        #panel .gl-row {
          min-height: calc(var(--u) * 20);
        }
      }
      /* goal lists: end */

      /*
       * A goal on a screen: its head, then its lists, one under another. Every head on a screen begins
       * at one left edge: a card's frame and padding come to 6 units, and those done, which have no
       * frame, are set in as far. The one in hand is picked out in the card's gold edge (`lit`).
       */
      .k-card.goal {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: calc(var(--u) * 3);
      }
      /* What kind of goal it is and who asks, over its head, is not over a group: no rule after it. */
      .k-card.goal > .k-label:first-child::after {
        content: none;
      }
      /* A lock and a button on a card of their own are as wide as they need. */
      .k-card.goal > :is(.k-chip, .k-btn) {
        align-self: flex-start;
      }
      /* Those done: a line each, with no frame of its own. */
      .goals-done {
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 2);
        padding-inline: calc(var(--u) * 6);
        opacity: 0.8;
      }
      /* The way from the tier's screen to research. */
      .k-card.to-research {
        color: inherit;
        font: var(--f-name);
      }
      /* A card's sentences, each on a line of its own. */
      .said {
        display: flex;
        flex-direction: column;
        gap: var(--u);
      }
      /*
       * A machine's recipe (`ui/flow.ts`): its parts' slots, an arrow, and the thing it makes. Over a
       * part, a dot for each one a make takes; in its slot's corner, how many it holds; under it, how
       * many a minute and the machines that make that many.
       */
      .flow {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: calc(var(--u) * 3);
      }
      .flow .fl-in {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: calc(var(--u) * 3);
      }
      .flow .fl-part {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: calc(var(--u) * 2);
        min-width: calc(var(--u) * 32);
      }
      .flow .fl-dots {
        display: flex;
        gap: calc(var(--u) * 2);
        height: calc(var(--u) * 4);
      }
      .flow .fl-dot {
        width: calc(var(--u) * 4);
        height: calc(var(--u) * 4);
        box-shadow: inset 0 0 0 var(--u) var(--k-dim);
      }
      .flow .fl-dot.full {
        background: var(--k-cream);
        box-shadow: none;
      }
      .flow .fl-dot.missing {
        box-shadow: inset 0 0 0 var(--u) var(--k-coral);
      }
      .flow .fl-slot {
        position: relative;
        width: calc(var(--u) * 28);
        height: calc(var(--u) * 28);
      }
      .flow .fl-slot.short {
        outline: var(--u) solid var(--k-coral);
        outline-offset: calc(var(--u) * -1);
      }
      .flow .fl-have {
        position: absolute;
        right: var(--u);
        bottom: calc(var(--u) * -2);
        color: var(--k-gold);
      }
      .flow .fl-slot.short .fl-have,
      .flow .fl-made.k-coral .fl-rate {
        color: var(--k-coral);
      }
      .flow .fl-rate {
        display: inline-flex;
        align-items: baseline;
        white-space: nowrap;
      }
      .flow .fl-by {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .flow .fl-top {
        color: var(--k-dim);
        white-space: nowrap;
      }
      .flow .fl-arrow {
        margin-top: calc(var(--u) * 16);
      }
      .flow .fl-made {
        display: inline-flex;
        align-items: center;
        gap: var(--u);
      }

      /* The tools, along the bottom; and over them, what is in hand and the buttons that act on it. */
      #dock {
        /* A tool's slot, and how many of them go in a row (the dock says how many it has). */
        --per: 13;
        --slot: min(calc(var(--u) * 21), calc((100vw - var(--edge) * 2 - var(--u) * 12) / var(--per)));
        position: fixed;
        z-index: 6;
        left: var(--edge);
        right: var(--edge);
        margin-inline: auto;
        width: fit-content;
        bottom: var(--bottom);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: var(--u);
        padding: var(--u);
        box-sizing: border-box;
      }
      #dock button {
        width: var(--slot);
        height: calc(var(--u) * 27);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 0;
        color: var(--k-cream);
        font: var(--f-small);
      }
      #dock button .art {
        flex: 1;
        display: grid;
        place-items: center;
      }
      #dock button:hover canvas,
      #dock button.lit canvas {
        translate: 0 calc(var(--u) * -1);
      }
      #dock button:active {
        translate: 0 var(--u);
      }
      #dock button.new {
        animation: new-tool 0.5s steps(5) 4;
      }
      #dock button.nudged,
      #books .nudged,
      #hand .grades.nudged {
        animation: nudged 0.9s steps(3) infinite;
      }
      /* No more of it may stand. */
      #dock button.off {
        filter: grayscale(0.7) brightness(0.6);
      }
      @keyframes new-tool {
        50% {
          filter: brightness(1.8);
          translate: 0 calc(var(--u) * -2);
        }
      }
      @keyframes nudged {
        50% {
          filter: brightness(1.5);
          translate: 0 calc(var(--u) * -2);
        }
      }
      #dock .gap {
        width: calc(var(--u) * 2);
      }
      /* As wide as the tools under it, and as tall as a row of grades: what it says wraps inside it, so
         the line never changes size with its words, and its buttons stay where they are. Buttons that
         leave its words too little room go to a row of their own, as on a phone. */
      #hand {
        position: fixed;
        z-index: 6;
        left: var(--edge);
        right: var(--edge);
        margin-inline: auto;
        width: fit-content;
        min-width: max(var(--dockw, 0px), calc(var(--u) * 300));
        bottom: calc(var(--bottom) + var(--dockh, 0px) + var(--u) * 2);
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        align-items: center;
        gap: calc(var(--u) * 3);
        padding: var(--u) calc(var(--u) * 2) var(--u) calc(var(--u) * 4);
        box-sizing: border-box;
        font: var(--f-ui);
      }
      #hand .say {
        flex: 1;
        min-width: 9em;
        min-height: calc(var(--u) * 20);
        display: flex;
        align-items: center;
        contain: inline-size;
      }
      #hand .say.bad {
        color: var(--k-coral);
      }
      /* The brush's colours. */
      #hand .tints {
        display: flex;
        gap: var(--u);
      }
      /* The grades a kind in hand may be built at: a numeral over the price of one. */
      #hand .grades {
        flex: none;
        display: flex;
        gap: var(--u);
      }
      #hand .grades button {
        width: calc(var(--u) * 20);
        height: calc(var(--u) * 20);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--u);
        color: var(--k-cream);
        font: var(--f-name);
      }
      #hand .acts {
        flex: none;
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 3);
      }
      /* A blueprint's place: its layout as a small picture, and beside it its size over its price. */
      #hand .print {
        gap: calc(var(--u) * 2);
        padding-inline: calc(var(--u) * 2);
      }
      #hand .print canvas {
        margin-block: calc(var(--u) * -1);
      }
      #hand .facts {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--u);
        font: var(--f-small);
        line-height: 1;
      }
      /* With a tool in hand it is the thing that matters: the brass frame. */
      #hand.building {
        border-image-source: var(--k-f-brass);
      }

      /* A panel: beside the yard on a wide screen, under it on a tall one. */
      #panel {
        position: fixed;
        z-index: 8;
        right: var(--edge);
        top: calc(var(--toph, calc(var(--top) + var(--u) * 24)) + var(--u) * 3);
        width: min(calc(var(--u) * 200), 46vw);
        max-height: calc(100dvh - var(--toph, calc(var(--top) + var(--u) * 24)) - var(--bottom) - var(--u) * 7);
        display: flex;
        flex-direction: column;
      }
      #panel > .k-body {
        flex: 1;
        min-height: 0;
      }
      /* A screen of its own has a little more room for a goal's rows. */
      #panel.full {
        width: min(calc(var(--u) * 224), 48vw);
      }
      /* A title of two parts breaks between them, never inside one. */
      #panel .k-title span {
        white-space: nowrap;
      }
      #panel.slide {
        animation: slide-in 0.18s ease-out;
      }
      @keyframes slide-in {
        from {
          translate: calc(var(--u) * 12) 0;
          opacity: 0;
        }
      }
      @keyframes slide-up {
        from {
          translate: 0 calc(var(--u) * 12);
          opacity: 0;
        }
      }
      /* The yard's sheet: its row of views stays put, and the view under it scrolls. */
      #panel > .k-body.views {
        overflow: hidden;
      }
      .views > .k-tabs,
      .views > .walk-slot {
        flex: none;
      }
      /*
       * Three names in a row, the last a long one: each tab is as wide as its name wants, and a name
       * breaks where the row is short. Pressed, a tab is the same size: nothing moves under the press.
       */
      .views > .k-tabs > .k-btn,
      .views > .k-tabs > .k-btn:active {
        flex: 1 1 auto;
        min-width: 0;
        padding: var(--u) calc(var(--u) * 3);
        line-height: 1.1;
        white-space: normal;
      }
      .views > .walk-slot:empty {
        display: none;
      }
      .views > .view {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 4);
      }
      /* The map: a whole number of screen pixels to each of its own, in the middle of the sheet. */
      .view[data-view="map"] {
        align-items: center;
      }
      canvas.map {
        flex: none;
        display: block;
        touch-action: none;
        cursor: pointer;
      }
      /* The bar that stays while a group of trouble is walked: what is wrong, which of how many, back, on and out. */
      .walk {
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 2);
        padding: var(--u) calc(var(--u) * 2) var(--u) calc(var(--u) * 4);
        box-sizing: border-box;
      }
      .walk[hidden] {
        display: none;
      }
      /* As wide as "88 of 88", so the buttons beside it stay where they are. */
      .walk-at {
        flex: none;
        min-width: calc(var(--u) * 44);
        font: var(--f-name);
        text-align: right;
        white-space: nowrap;
      }
      .walk .flip {
        transform: scaleX(-1);
      }
      #walk {
        position: fixed;
        z-index: 7;
        top: calc(var(--toph, calc(var(--top) + var(--u) * 24)) + var(--u) * 3);
        left: var(--edge);
        right: var(--edge);
      }
      /* What is wrong, and the kinds of piece it is wrong with. */
      .wrong {
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 3);
        min-width: 0;
      }
      .wrong .kinds {
        flex: none;
        display: flex;
        align-items: center;
        gap: var(--u);
      }

      /*
       * A table of numbers (`ui/table.ts`): what a row is about takes the room there is, and each
       * number has a column of one width, right-aligned under its name. A row shares the table's
       * columns, so every row lines up with the head.
       */
      .tbl {
        --col: calc(var(--u) * 30);
        flex: none;
        display: grid;
        grid-template-columns: minmax(0, 1fr) repeat(var(--cols), var(--col));
        gap: calc(var(--u) * 2) calc(var(--u) * 3);
      }
      .tbl > .tbl-head,
      .tbl > .tbl-row {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: subgrid;
        align-items: center;
        gap: 0 calc(var(--u) * 3);
      }
      .tbl[hidden] {
        display: none;
      }
      .tbl-head {
        align-items: end;
        font: var(--f-small);
        color: var(--k-dim);
      }
      .tbl-head > * {
        text-align: right;
      }
      .tbl-head > :first-child {
        text-align: left;
      }
      .tbl .num {
        font: var(--f-name);
        text-align: right;
        white-space: nowrap;
      }
      .tbl .num.faint {
        color: var(--k-faint);
      }
      .tbl .num.coral {
        color: var(--k-coral);
      }
      .tbl .num.gold {
        color: var(--k-gold);
      }
      .tbl-what {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: var(--u);
      }
      .tbl-note {
        font: var(--f-small);
        color: var(--k-coral);
      }
      .tbl-note:empty {
        display: none;
      }
      /* Rows to be pressed are cards, tall enough for a finger; the head keeps to their inside edges. */
      .tbl.cards > .tbl-head {
        padding-inline: calc(var(--u) * 6);
      }
      button.tbl-row {
        min-height: calc(var(--u) * 24);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .k-card.order {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: calc(var(--u) * 2);
      }
      /* What it pays and its button go under the title where the title would be left narrower than this. */
      .order > .k-row {
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .order > .k-row > .k-name {
        flex: 1 0 calc(var(--u) * 90);
      }
      .k-card.order.ready {
        border-image-source: var(--k-f-card-lit);
      }
      .k-card.order.hung {
        opacity: 0.6;
      }
      /* A place waiting for its order is as tall as the shortest order, so the order only adds below it. */
      .k-card.order.waiting {
        min-height: calc(var(--u) * 64);
        justify-content: center;
        text-align: center;
      }
      /* Research, as the small tree it is: each row a piece of it, the later hanging off the earlier. */
      .branch {
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 3);
      }
      /* The later plan hangs off the earlier one by a dowel. */
      .branch > .twig {
        display: none;
      }
      .branch > .twig + .plan {
        position: relative;
        margin-left: calc(var(--u) * 10);
      }
      .branch > .twig + .plan::before {
        content: "";
        position: absolute;
        left: calc(var(--u) * -10);
        top: calc(var(--u) * -7);
        width: calc(var(--u) * 3);
        height: calc(var(--u) * 12);
        border: solid transparent;
        border-width: 0 0 calc(var(--u) * 5) calc(var(--u) * 5);
        border-image: var(--k-f-elbow) 0 0 5 5;
        image-rendering: pixelated;
      }
      .rows {
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        align-items: center;
        gap: calc(var(--u) * 2) calc(var(--u) * 4);
      }
      .rows .num {
        text-align: right;
      }
      /* A thing named in the depot's books takes the picture's column and the name's. */
      .rows > .k-thing {
        grid-column: span 2;
      }
      /* Top yards: a line for each yard, its place, its owner's face and name, and its Coins. */
      .board {
        display: flex;
        flex-direction: column;
        gap: var(--u);
      }
      .board > .k-btn {
        align-self: flex-start;
      }
      .board > .board-row {
        display: grid;
        grid-template-columns: calc(var(--u) * 10) auto 1fr auto;
        align-items: center;
        gap: calc(var(--u) * 3);
        padding: var(--u) calc(var(--u) * 3);
        border-style: solid;
        border-color: transparent;
        border-width: calc(var(--u) * 2);
      }
      .board-row .place {
        text-align: right;
        color: var(--k-gold);
      }
      .board-row .who {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .board-row .who > * {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .board-row .k-thing-name {
        color: var(--k-cream);
      }

      .recipe {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: calc(var(--u) * 2);
      }
      .recipe .k-slot {
        width: calc(var(--u) * 16);
        height: calc(var(--u) * 16);
        position: relative;
      }
      .recipe .k-slot b {
        position: absolute;
        right: 0;
        bottom: calc(var(--u) * -1);
        font: var(--f-name);
        text-shadow:
          var(--u) 0 0 var(--k-ink),
          0 var(--u) 0 var(--k-ink),
          calc(var(--u) * -1) 0 0 var(--k-ink);
      }
      .pins {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--u) * 2);
      }
      .pins button {
        width: calc(var(--u) * 18);
        height: calc(var(--u) * 18);
      }

      /* News, said once and then gone. */
      /* A splitter's ways out on its card: a button each, round its picture, as they lie in the yard. */
      .ways {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: center;
        gap: calc(var(--u) * 2);
        padding-top: calc(var(--u) * 2);
      }
      .ways canvas {
        grid-area: 2 / 2;
        justify-self: center;
      }
      #feed {
        position: fixed;
        z-index: 4;
        left: var(--edge);
        bottom: var(--bottom);
        width: min(calc(var(--u) * 150), calc(50vw - var(--u) * 150));
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 2);
        pointer-events: none;
      }
      #feed .gone {
        opacity: 0;
        transition: opacity 0.9s;
      }

      /* A nudge about a part of the interface, said beside that part with its tail on it. */
      #coach {
        position: fixed;
        z-index: 11;
        left: 0;
        top: 0;
        max-width: min(calc(var(--u) * 140), calc(100vw - 16px));
        box-sizing: border-box;
        pointer-events: none;
      }
      #coach::after {
        left: var(--tail, calc(var(--u) * 5));
      }
      #coach.below::after {
        bottom: auto;
        top: calc(var(--u) * -5);
        transform: scaleY(-1);
      }
      /* Said about a part of a card, it is over the card. */
      #coach.on-card {
        z-index: 91;
      }

      /* An order filled: what it paid, what it opened, what is asked for next. */
      #banner {
        position: fixed;
        z-index: 12;
        right: var(--edge);
        top: calc(var(--toph, calc(var(--top) + var(--u) * 24)) + var(--u) * 3);
        width: min(calc(var(--u) * 184), calc(100vw - var(--edge) * 2));
        box-sizing: border-box;
      }
      #banner .k-body {
        gap: calc(var(--u) * 2);
      }

      /* The letter about an absence. */
      #letter {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: grid;
        place-items: center;
        padding: var(--top) var(--edge) var(--bottom);
        box-sizing: border-box;
        background: #1a0f1e99;
        transition: opacity 0.3s;
      }
      #letter.gone {
        opacity: 0;
        pointer-events: none;
      }
      .letter {
        width: min(calc(var(--u) * 230), 100%);
        max-height: 100%;
        overflow: auto;
      }
      .letter .line {
        visibility: hidden;
      }
      .letter .line.in {
        visibility: visible;
        animation: line-in 0.3s steps(4);
      }
      @keyframes line-in {
        from {
          translate: calc(var(--u) * -6) 0;
          opacity: 0;
        }
      }
      .made {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--u) * 2) calc(var(--u) * 5);
      }
      .made span {
        display: inline-flex;
        align-items: center;
        gap: calc(var(--u) * 2);
      }

      @media (max-width: 1100px), (orientation: portrait) {
        #feed {
          bottom: calc(var(--bottom) + var(--dockh, 0px) + var(--handh, 0px) + var(--u) * 4);
          width: min(calc(var(--u) * 150), calc(100vw - var(--edge) * 2));
        }
      }
      @media (max-width: 760px), (orientation: portrait) {
        /* Two even rows once the tools no longer fit in one. */
        #dock {
          max-width: calc(var(--per) * (var(--slot) + var(--u)) + var(--u) * 11);
        }
        #hand .say {
          flex: 1 1 11em;
        }
        /* Move, Copy, Remove, Save and cancel in one row: undo is in the line again once the area is let go. */
        #hand .acts.tight {
          gap: calc(var(--u) * 2);
        }
        #hand .acts.tight .k-btn:not(.icon) {
          padding-inline: var(--u);
        }
        #hand .acts.tight .undo {
          display: none;
        }
        #top {
          gap: calc(var(--u) * 2);
        }
        #purse {
          gap: calc(var(--u) * 4);
        }
        #power .k-bar {
          width: calc(var(--u) * 20);
        }
        /* Two rows: the purse and the way out, then the power and the yard's books. */
        #corner {
          margin-left: auto;
          order: 2;
        }
        #purse {
          order: 1;
        }
        #power {
          order: 3;
        }
        #books {
          order: 4;
        }
        /* The yard's button leads its row, which ends at the screen's edge: its count has room to widen there. */
        #books > .pip.bad {
          order: -1;
        }
        /* Any other button may end the row: its count widens inward, so the edge never cuts it. */
        #books > .pip:not(.bad)[data-n]::after {
          left: auto;
          right: calc(var(--u) * -3);
        }
        /* Short of power, the numbers say so and the bar gives them its room. */
        #power.short .k-bar {
          display: none;
        }
        #panel {
          left: var(--edge);
          right: var(--edge);
          width: auto;
          top: auto;
          bottom: calc(var(--bottom) + var(--dockh, 0px) + var(--u) * 2);
          max-height: min(54dvh, calc(100dvh - var(--dockh, 0px) - var(--top) - var(--u) * 56));
        }
        #panel.slide {
          animation-name: slide-up;
        }
        /* The tier's screen and research are screens of their own: the whole of the page, over the tools. */
        #panel.full {
          z-index: 12;
          top: var(--top);
          bottom: var(--bottom);
          width: auto;
          max-height: none;
        }
        #hand {
          width: auto;
          min-width: 0;
        }
        #feed {
          bottom: calc(var(--bottom) + var(--dockh, 0px) + var(--u) * 28);
        }
        /* The yard's sheet is a full sheet: from under the top row to the foot of the screen. */
        #panel[data-panel="depot"] {
          top: calc(var(--toph, calc(var(--top) + var(--u) * 24)) + var(--u) * 3);
          bottom: var(--bottom);
          max-height: none;
        }
        #feed > :nth-last-child(n + 3),
        body.panel-open #feed,
        body.panel-open #track,
        body.panel-open #study,
        body.walking #track,
        body.walking #study {
          display: none;
        }
      }
      /* Asked for less motion: nothing here bobs, blinks or slides in; a nudge's bubble still points. Last, so
         that it wins over every rule above that sets an animation. */
      @media (prefers-reduced-motion: reduce) {
        #dock button.new,
        #dock button.nudged,
        #books .nudged,
        #hand .grades.nudged,
        #panel.slide,
        .letter .line.in {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="words"></canvas>
    <div id="top">
      <div id="purse" class="k-plaque hung"></div>
      <button id="power" class="k-plaque hung" type="button"></button>
      <div id="books"></div>
      <div id="corner"></div>
    </div>
    <button id="track" class="k-plaque hung" type="button"></button>
    <button id="study" class="k-plaque" type="button" hidden></button>
    <div id="visit" class="k-plaque" hidden></div>
    <div id="walk"></div>
    <div id="feed" aria-live="polite"></div>
    <div id="hand" class="k-tip"></div>
    <nav id="dock" class="k-shelf" aria-label="Tools"></nav>
    <aside id="panel" class="k-panel" role="dialog" aria-labelledby="panel-title" hidden></aside>
    <div id="banner" class="k-panel" hidden></div>
    <div id="coach" class="k-say" hidden></div>
    <div id="letter" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
