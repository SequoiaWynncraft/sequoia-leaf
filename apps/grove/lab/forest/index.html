<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sequoia Grove · The Forest</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #150f0d;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      canvas {
        position: fixed;
        left: 0;
        top: 0;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        cursor: grab;
      }
      canvas.dragging {
        cursor: grabbing;
      }
      canvas.pointing {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="forest"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
