<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sequoia Grove</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a0f1e;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100dvh;
        touch-action: none;
      }
      /* The interface: plain panels in the grove's dusk colours, sized for a thumb. */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font:
          600 14px/1.25 ui-monospace,
          "DejaVu Sans Mono",
          Menlo,
          Consolas,
          monospace;
        color: #fff3cf;
        padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
          max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      }
      #hud .panel,
      #hud .deed {
        pointer-events: auto;
        background: #2a1733e6;
        border: 2px solid #5a296e;
        box-shadow:
          0 0 0 2px #1a0f1e,
          inset 0 -3px 0 #1a0f1e66;
        border-radius: 2px;
      }
      #hud .purse {
        position: absolute;
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        padding: 8px 12px;
        min-width: 120px;
      }
      #hud .tree {
        position: absolute;
        top: max(10px, env(safe-area-inset-top));
        right: max(10px, env(safe-area-inset-right));
        padding: 8px 12px;
        text-align: right;
      }
      #hud .label {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #d49045;
      }
      #hud .sap {
        font-size: 26px;
        color: #f5b95e;
      }
      #hud .per {
        font-size: 12px;
        color: #e0c39a;
      }
      #hud .stage {
        font-size: 17px;
      }
      #hud .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: max(12px, env(safe-area-inset-bottom));
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        padding: 0 10px;
      }
      #hud .deed {
        font: inherit;
        color: #fff3cf;
        min-height: 52px;
        min-width: min(260px, 44vw);
        padding: 8px 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        cursor: pointer;
      }
      #hud .deed .cost {
        font-size: 12px;
        color: #e0c39a;
      }
      #hud .deed.ready {
        border-color: #f5b95e;
        background: #54286ae6;
      }
      #hud .deed:disabled {
        color: #9a86a8;
        cursor: default;
      }
      #hud .deed:active:not(:disabled) {
        transform: translateY(2px);
      }
      #hud .card {
        position: absolute;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
        padding: 16px 22px;
        text-align: center;
        display: grid;
        gap: 6px;
        cursor: pointer;
        max-width: 80vw;
      }
      #hud .pop {
        position: absolute;
        transform: translate(-50%, -100%);
        color: #f5b95e;
        font-size: 16px;
        text-shadow: 0 2px 0 #1a0f1e;
        animation: pop 0.9s ease-out forwards;
      }
      #hud .sap.bump {
        animation: bump 0.25s ease-out;
      }
      @keyframes bump {
        40% {
          transform: scale(1.18);
          color: #fff3cf;
        }
      }
      /* The growing ceremony: gold light floods in, holds while the tree grows behind it, and clears. */
      #hud .veil {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #hud .veil::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 55%, #fff3cf 0%, #f5b95e 38%, #d4904500 78%);
        animation: veil 4.2s ease-in-out forwards;
      }
      @keyframes veil {
        0% {
          opacity: 0;
        }
        10%,
        16% {
          opacity: 1;
        }
        42% {
          opacity: 0.16;
        }
        86% {
          opacity: 0.16;
        }
        100% {
          opacity: 0;
        }
      }
      #hud .rite {
        text-align: center;
        display: grid;
        gap: 4px;
        text-shadow:
          0 2px 0 #1a0f1e,
          0 0 18px #1a0f1e;
        animation: rite 4.2s ease-out forwards;
      }
      #hud .rite .name {
        font-size: clamp(30px, 7vw, 54px);
        color: #fff3cf;
      }
      #hud .rite .line {
        font-size: 16px;
        color: #f5b95e;
      }
      @keyframes rite {
        0%,
        14% {
          opacity: 0;
          transform: scale(0.7);
        }
        26% {
          opacity: 1;
          transform: scale(1.06);
        }
        32%,
        84% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-12px);
        }
      }
      #hud .toast {
        position: absolute;
        left: 50%;
        top: 22%;
        padding: 10px 16px;
        animation: toast 2.4s ease-out forwards;
      }
      @keyframes toast {
        0% {
          opacity: 0;
          transform: translate(-50%, 10px);
        }
        12%,
        80% {
          opacity: 1;
          transform: translate(-50%, 0);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -10px);
        }
      }
      @keyframes pop {
        to {
          transform: translate(-50%, -260%);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div id="hud"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
