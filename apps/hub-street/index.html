<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#2a1733" />
    <title>Main Street</title>
    <style>
      :root {
        --ink: #1a0f1e;
        --plum: #2a1733;
        --plum2: #3d2050;
        --edge: #5a296e;
        --violet: #7a348a;
        --rose: #b84d84;
        --coral: #e67967;
        --gold: #f5b95e;
        --gold-d: #d49045;
        --gold-l: #ffd98a;
        --cream: #fff3cf;
        --dim: #cdb4c9;
        --leaf: #62a658;
        --dock: 64px;
        --safe-b: max(8px, env(safe-area-inset-bottom));
        --safe-t: max(8px, env(safe-area-inset-top));
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--plum);
        overflow: hidden;
        overscroll-behavior: none;
        font:
          600 13px/1.3 ui-monospace,
          "DejaVu Sans Mono",
          Menlo,
          Consolas,
          monospace;
        color: var(--cream);
        user-select: none;
        -webkit-user-select: none;
      }
      canvas#view {
        position: fixed;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100dvh;
        touch-action: none;
        cursor: pointer;
      }
      .pix {
        image-rendering: pixelated;
        display: block;
        flex: none;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: 0;
        background: none;
        padding: 0;
      }
      .plate {
        background: #2a1733ee;
        border: 2px solid var(--edge);
        box-shadow: 0 0 0 2px var(--ink);
        border-radius: 3px;
      }
      .label {
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--gold-d);
      }

      /* ---------- the top of the screen: who you are, what you have ---------- */
      #top {
        position: fixed;
        top: var(--safe-t);
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        display: flex;
        align-items: stretch;
        gap: 8px;
        pointer-events: none;
        z-index: 20;
      }
      #top > * {
        pointer-events: auto;
      }
      #top .grow {
        flex: 1;
        pointer-events: none;
      }
      #me {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 10px 3px 6px;
        height: 44px;
        transition: transform 0.08s;
      }
      #me:active,
      #mute:active {
        transform: translateY(2px);
      }
      #me .who {
        text-align: left;
        line-height: 1.15;
      }
      #me .who b {
        display: block;
        font-size: 13px;
      }
      #me .who span {
        font-size: 10px;
        color: var(--dim);
      }
      #me .face {
        width: 34px;
        height: 34px;
        overflow: hidden;
        background: var(--plum2);
        border: 1px solid var(--edge);
        display: grid;
        place-items: start center;
      }
      #purse {
        display: flex;
        gap: 8px;
      }
      .cur {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px 0 8px;
        height: 44px;
        background: #2a1733ee;
        border: 2px solid var(--edge);
        box-shadow: 0 0 0 2px var(--ink);
        border-radius: 3px;
        cursor: pointer;
      }
      .cur b {
        font-size: 17px;
        font-variant-numeric: tabular-nums;
        min-width: 2ch;
      }
      .cur.leaf {
        border-color: var(--gold);
        box-shadow:
          0 0 0 2px var(--ink),
          0 0 14px #f5b95e44;
      }
      .cur.leaf b {
        font-size: 20px;
        color: var(--gold-l);
      }
      .cur.coin b {
        color: var(--gold);
      }
      .cur.bump {
        animation: bump 0.28s ease-out;
      }
      .cur.short {
        animation: shake 0.3s;
        border-color: var(--coral);
      }
      @keyframes bump {
        0% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.14) translateY(-2px);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20%,
        60% {
          transform: translateX(-4px);
        }
        40%,
        80% {
          transform: translateX(4px);
        }
      }
      #mute {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        transition: transform 0.08s;
      }

      /* ---------- what the guild is doing ---------- */
      #feed {
        position: fixed;
        top: calc(var(--safe-t) + 54px);
        right: max(8px, env(safe-area-inset-right));
        width: min(300px, calc(100vw - 16px));
        display: flex;
        flex-direction: column;
        gap: 4px;
        pointer-events: none;
        z-index: 15;
      }
      .news {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 9px 5px 7px;
        background: #1a0f1ed9;
        border-left: 3px solid var(--gold);
        font-size: 12px;
        line-height: 1.25;
        animation: news-in 0.35s cubic-bezier(0.2, 1.4, 0.4, 1);
        transition:
          opacity 0.6s,
          transform 0.6s;
      }
      .news.old {
        opacity: 0.55;
      }
      .news.gone {
        opacity: 0;
        transform: translateX(12px);
      }
      .news b {
        color: var(--gold-l);
      }
      @keyframes news-in {
        from {
          opacity: 0;
          transform: translateX(30px) scale(0.9);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ---------- the dock: every place, one tap away ---------- */
      #dock {
        position: fixed;
        left: 0;
        right: 0;
        bottom: var(--safe-b);
        display: flex;
        justify-content: center;
        gap: 6px;
        padding: 0 6px;
        z-index: 20;
        pointer-events: none;
      }
      .stop {
        position: relative;
        pointer-events: auto;
        width: 62px;
        height: 56px;
        display: grid;
        justify-items: center;
        align-content: center;
        gap: 2px;
        background: #2a1733ee;
        border: 2px solid var(--edge);
        box-shadow:
          0 0 0 2px var(--ink),
          0 3px 0 2px var(--ink);
        border-radius: 4px;
        transition:
          transform 0.08s,
          border-color 0.2s,
          background 0.2s;
      }
      .stop small {
        font-size: 9px;
        letter-spacing: 0.02em;
        color: var(--dim);
        white-space: nowrap;
      }
      .stop:hover {
        border-color: var(--violet);
        transform: translateY(-2px);
      }
      .stop:active {
        transform: translateY(3px);
        box-shadow: 0 0 0 2px var(--ink);
      }
      .stop.here {
        border-color: var(--gold);
        background: #4a2360ee;
      }
      .stop.here small {
        color: var(--gold-l);
      }
      .stop.pop {
        animation: bump 0.25s;
      }
      .stop .dot {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 9px;
        height: 9px;
        background: var(--gold);
        border: 2px solid var(--ink);
        border-radius: 50%;
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        50% {
          transform: scale(1.35);
        }
      }

      /* ---------- panels ---------- */
      #panel {
        position: fixed;
        right: max(10px, env(safe-area-inset-right));
        top: calc(var(--safe-t) + 54px);
        width: 372px;
        max-height: calc(100dvh - var(--safe-t) - 54px - var(--dock) - var(--safe-b) - 12px);
        display: flex;
        flex-direction: column;
        background: #2a1733f5;
        border: 2px solid var(--edge);
        box-shadow:
          0 0 0 2px var(--ink),
          0 10px 30px #0008;
        border-radius: 4px;
        z-index: 30;
        opacity: 0;
        transform: translateX(26px);
        pointer-events: none;
        transition:
          opacity 0.18s,
          transform 0.22s cubic-bezier(0.2, 1.3, 0.4, 1);
      }
      #panel.on {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      #panel.wide {
        width: min(760px, calc(100vw - 20px));
      }
      #panel header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 8px 8px 12px;
        border-bottom: 2px solid var(--edge);
        background: #3d205099;
      }
      #panel header h2 {
        margin: 0;
        font-size: 16px;
        color: var(--gold-l);
        flex: 1;
      }
      #panel header .x {
        width: 34px;
        height: 34px;
        font-size: 18px;
        color: var(--dim);
        border: 2px solid var(--edge);
        border-radius: 3px;
        background: var(--plum);
      }
      #panel header .x:active {
        transform: translateY(2px);
      }
      #panel .body {
        padding: 10px 12px 12px;
        overflow-y: auto;
        overscroll-behavior: contain;
        display: flex;
        flex-direction: column;
        gap: 8px;
        scrollbar-width: thin;
        scrollbar-color: var(--edge) transparent;
      }
      .says {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 6px 8px;
        background: #1a0f1e99;
        border-left: 3px solid var(--gold-d);
      }
      .says .face {
        width: 40px;
        height: 40px;
        overflow: hidden;
        background: var(--plum2);
        border: 1px solid var(--edge);
        flex: none;
        display: grid;
        place-items: center;
      }
      .says q {
        quotes: none;
        font-size: 12px;
        color: var(--cream);
      }
      .says .label {
        display: block;
      }
      .row {
        display: grid;
        grid-template-columns: 44px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 8px;
        background: #3d205066;
        border: 1px solid #5a296e99;
        border-radius: 3px;
      }
      .row .pic {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        background: var(--ink);
        border: 1px solid var(--edge);
      }
      .row .name {
        font-size: 13px;
      }
      .row .sub {
        font-size: 11px;
        color: var(--dim);
        font-weight: 400;
        margin-top: 2px;
      }
      .row.done {
        opacity: 0.6;
      }
      .row.ready {
        border-color: var(--gold);
        background: #54286a99;
        box-shadow: 0 0 12px #f5b95e33 inset;
      }
      .bar {
        height: 8px;
        margin-top: 5px;
        background: var(--ink);
        border: 1px solid var(--edge);
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--gold);
        transition: width 0.4s;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        min-width: 64px;
        min-height: 36px;
        padding: 4px 10px;
        color: var(--ink);
        background: var(--gold);
        border: 2px solid var(--ink);
        box-shadow:
          0 3px 0 var(--gold-d),
          0 3px 0 2px var(--ink);
        border-radius: 3px;
        font-weight: 700;
        transition: transform 0.06s;
        white-space: nowrap;
      }
      .btn:active {
        transform: translateY(3px);
        box-shadow: 0 0 0 0 var(--ink);
      }
      .btn.quiet {
        color: var(--cream);
        background: var(--plum2);
        box-shadow:
          0 3px 0 var(--edge),
          0 3px 0 2px var(--ink);
      }
      .btn.no {
        animation: shake 0.3s;
      }
      .btn[disabled] {
        opacity: 0.5;
        pointer-events: none;
      }
      .tag {
        font-size: 11px;
        color: var(--leaf);
      }
      .note {
        font-size: 11px;
        color: var(--dim);
        font-weight: 400;
      }
      .emotes {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .emotes .btn {
        flex: 1 1 52px;
        min-width: 0;
        padding: 4px 2px;
        flex-direction: column;
        min-height: 54px;
        font-size: 11px;
      }
      .sitters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .sitter {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 8px 3px 4px;
        background: #3d205099;
        border: 1px solid var(--edge);
        border-radius: 3px;
        font-size: 12px;
      }
      .sitter .face {
        width: 22px;
        height: 22px;
        overflow: hidden;
        display: grid;
        place-items: start center;
      }
      .roll {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 3px 8px;
        font-size: 11px;
      }
      .roll div b {
        color: var(--gold-l);
        flex: none;
      }
      .roll div {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        padding: 3px 6px;
        background: #1a0f1e80;
        border-left: 3px solid var(--edge);
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .roll div span {
        flex: 1;
        min-width: 0;
        font-weight: 400;
        color: var(--dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .roll div.here {
        border-left-color: var(--leaf);
      }
      .roll div.here em {
        color: var(--leaf);
      }
      .roll div.gone {
        border-left-color: var(--coral);
        background: #e6796722;
      }
      .roll div.gone em {
        color: var(--coral);
      }
      .roll div.call {
        background: #f5b95e33;
      }
      .roll em {
        font-style: normal;
        flex: none;
      }
      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .stat {
        padding: 6px 8px;
        background: #3d205066;
        border: 1px solid #5a296e99;
      }
      .stat b {
        display: block;
        font-size: 16px;
        color: var(--gold-l);
      }
      .hero {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .hero .stand {
        width: 76px;
        height: 112px;
        display: grid;
        place-items: end center;
        background: linear-gradient(#5a296e, #b84d84 70%, #e67967);
        border: 2px solid var(--edge);
        padding-bottom: 6px;
        flex: none;
      }
      .hero h3 {
        margin: 0 0 2px;
        font-size: 18px;
        color: var(--gold-l);
      }
      iframe.works {
        width: 100%;
        height: min(46dvh, 420px);
        border: 2px solid var(--edge);
        background: var(--ink);
      }
      canvas.mini {
        width: 100%;
        height: 96px;
        image-rendering: pixelated;
        border: 2px solid var(--edge);
        background: var(--ink);
      }

      /* ---------- a guild-mate's card ---------- */
      #card {
        position: fixed;
        width: 214px;
        padding: 8px;
        z-index: 25;
        display: none;
        animation: card-in 0.18s cubic-bezier(0.2, 1.5, 0.4, 1);
        transform-origin: 50% 100%;
      }
      #card.on {
        display: block;
      }
      #card .top {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #card .stand {
        width: 44px;
        height: 62px;
        display: grid;
        place-items: end center;
        background: var(--plum2);
        border: 1px solid var(--edge);
        padding-bottom: 3px;
        flex: none;
      }
      #card h3 {
        margin: 0;
        font-size: 14px;
        color: var(--gold-l);
      }
      #card .acts {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      #card .acts .btn {
        flex: 1;
        min-height: 32px;
      }
      @keyframes card-in {
        from {
          opacity: 0;
          transform: scale(0.7) translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ---------- coming home ---------- */
      #away {
        position: fixed;
        left: 50%;
        top: 46%;
        width: min(348px, calc(100vw - 20px));
        transform: translate(-50%, -50%) scale(0.9);
        opacity: 0;
        pointer-events: none;
        padding: 12px 14px 14px;
        z-index: 40;
        transition:
          opacity 0.25s,
          transform 0.3s cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      #away.on {
        opacity: 1;
        transform: translate(-50%, -50%);
        pointer-events: auto;
      }
      #away h2 {
        margin: 2px 0 8px;
        font-size: 19px;
        color: var(--gold-l);
      }
      #away .got {
        display: grid;
        grid-template-columns: 30px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 7px 0;
        border-top: 1px solid #5a296e99;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 0.25s,
          transform 0.3s cubic-bezier(0.2, 1.6, 0.4, 1);
      }
      #away .got.in {
        opacity: 1;
        transform: none;
      }
      #away .got b {
        color: var(--gold-l);
        font-size: 15px;
      }
      #away .got .heads {
        display: flex;
        gap: 3px;
      }
      #away .btn {
        width: 100%;
        margin-top: 10px;
        min-height: 42px;
        font-size: 14px;
      }

      #hint {
        position: fixed;
        left: 50%;
        bottom: calc(var(--safe-b) + var(--dock) + 10px);
        transform: translateX(-50%);
        padding: 5px 12px;
        background: #1a0f1ecc;
        border-left: 3px solid var(--gold);
        width: max-content;
        max-width: min(94vw, 560px);
        text-align: center;
        text-wrap: balance;
        font-size: 12px;
        z-index: 12;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s;
      }
      #hint.on {
        opacity: 1;
      }
      .fly {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 60;
        pointer-events: none;
        will-change: transform;
      }
      #veil {
        position: fixed;
        inset: 0;
        background: var(--plum);
        z-index: 80;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.9s ease-out;
      }
      #veil.off {
        opacity: 0;
      }

      @media (max-width: 640px) {
        :root {
          --dock: 52px;
        }
        #dock {
          gap: 4px;
        }
        .stop {
          width: 48px;
          height: 46px;
        }
        .stop small {
          display: none;
        }
        #me .who {
          display: none;
        }
        #me {
          padding: 3px 4px;
        }
        #top {
          gap: 6px;
        }
        #purse {
          gap: 6px;
        }
        .cur {
          padding: 0 8px 0 6px;
        }
        #feed {
          left: 8px;
          right: 8px;
          width: auto;
        }
        .news {
          font-size: 11px;
        }
        #panel,
        #panel.wide {
          left: 6px;
          right: 6px;
          width: auto;
          top: auto;
          bottom: calc(var(--safe-b) + var(--dock) + 8px);
          max-height: min(50dvh, 430px);
          transform: translateY(30px);
        }
        #panel.on {
          transform: none;
        }
        iframe.works {
          height: 220px;
        }
        #away {
          top: 42%;
        }
      }
      @media (max-height: 520px) {
        .stop {
          height: 44px;
        }
        .stop small {
          display: none;
        }
        :root {
          --dock: 50px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="top">
      <button id="me" class="plate" aria-label="Your profile"></button>
      <div id="purse">
        <div class="cur leaf" id="leafBox" title="Leaf"><b id="leaf">0</b></div>
        <div class="cur coin" id="coinBox" title="Coins, from the Works"><b id="coins">0</b></div>
      </div>
      <span class="grow"></span>
      <button id="mute" class="plate" aria-label="Sound"></button>
    </div>
    <div id="feed" aria-live="polite"></div>
    <div id="hint"></div>
    <div id="dock"></div>
    <div id="card" class="plate"></div>
    <section id="panel">
      <header>
        <span class="ic"></span>
        <h2></h2>
        <button class="x" aria-label="Close">×</button>
      </header>
      <div class="body"></div>
    </section>
    <div id="away" class="plate"></div>
    <div id="veil"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
