<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Guild Town</title>
    <link rel="stylesheet" href="../../packages/kit/src/kit.css" />
    <style>
      /* Only where the town puts things; how they look is the kit's. */
      :root {
        --edge: max(calc(var(--u) * 4), env(safe-area-inset-left), env(safe-area-inset-right));
        --top: max(calc(var(--u) * 4), env(safe-area-inset-top));
        --bottom: max(calc(var(--u) * 4), env(safe-area-inset-bottom));
        /* The dock: a slot's side, and how tall the whole plank stands off the bottom. */
        --slot: min(calc(var(--u) * 21), calc((100vw - var(--u) * 27) / 9));
        --dock: calc(var(--u) * 33 + var(--bottom));
        --sheet-floor: var(--dock);
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        display: block;
        touch-action: none;
        image-rendering: pixelated;
      }

      /* Top left: the purse, Leaf first, because it is the precious one; beside it, who is about. */
      /* Where there is no room beside the purse for the corner's buttons too, who is about goes under it. */
      #top {
        position: fixed;
        z-index: 5;
        top: var(--top);
        left: var(--edge);
        max-width: calc(100vw - var(--edge) * 2 - var(--u) * 50);
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: calc(var(--u) * 2) calc(var(--u) * 3);
      }
      #purse {
        display: flex;
        gap: calc(var(--u) * 6);
        padding: var(--u) calc(var(--u) * 4);
      }
      #about {
        padding-inline: calc(var(--u) * 4);
      }
      /* At somebody else's camp, on a line of its own under the purse: whose camp it is, and the way home. */
      #visit {
        flex-basis: 100%;
      }
      #visit[hidden] {
        display: none;
      }
      /* Its line has no corner buttons beside it: it may be as wide as the screen. */
      #visit > .k-plaque {
        display: inline-flex;
        align-items: center;
        gap: calc(var(--u) * 3);
        width: max-content;
        max-width: calc(100vw - var(--edge) * 2);
        box-sizing: border-box;
        padding: var(--u) calc(var(--u) * 3);
      }
      /* Who is about: a part for each, a row for each person, their face, name and rank. */
      .about {
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 2);
      }
      .about-part {
        display: flex;
        flex-direction: column;
        gap: var(--u);
        margin-bottom: calc(var(--u) * 2);
      }
      button.about-row {
        display: flex;
        gap: calc(var(--u) * 4);
        width: 100%;
        min-height: calc(var(--u) * 20);
        padding: var(--u) calc(var(--u) * 2);
        box-sizing: border-box;
        background: none;
        border: 0;
        color: inherit;
        font: var(--f-ui);
        text-align: left;
        cursor: pointer;
      }
      button.about-row:hover,
      button.about-row:focus-visible {
        background: #f5b95e1f;
      }
      button.about-row:active {
        translate: 0 var(--u);
      }
      .about-row.gone {
        opacity: 0.45;
      }
      .about-row .k-thing-pic {
        min-width: calc(var(--u) * 18);
      }
      .about-who {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .about-who .k-thing-name {
        color: var(--k-cream);
      }
      .about-who > * {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* Under the purse while the town's live connection is down, on a line of its own. */
      #link {
        flex-basis: 100%;
        pointer-events: none;
      }
      #link > span {
        display: inline-block;
        padding: 0 calc(var(--u) * 3);
      }
      /* The member's emotes, over their own head, the picture of each one to choose. */
      #emotes {
        position: fixed;
        z-index: 9;
        translate: -50% -100%;
        display: flex;
        gap: var(--u);
        padding: var(--u);
      }
      #emotes .k-btn {
        min-width: calc(var(--u) * 20);
        min-height: calc(var(--u) * 20);
      }
      #corner {
        position: fixed;
        z-index: 5;
        top: var(--top);
        right: var(--edge);
        display: flex;
        gap: calc(var(--u) * 3);
      }

      /* The dock: every place, one touch away. */
      #dock {
        position: fixed;
        z-index: 6;
        left: 50%;
        translate: -50% 0;
        bottom: var(--bottom);
        display: flex;
        gap: var(--u);
        padding: var(--u);
      }
      #dock button {
        width: var(--slot);
        height: calc(var(--u) * 21);
        padding: 0;
        background: none;
      }
      #dock button:hover canvas,
      #dock button.lit canvas {
        translate: 0 calc(var(--u) * -1);
      }
      #dock button:active {
        translate: 0 var(--u);
      }

      /* A place's panel: beside the town on a wide screen, under it on a tall one. */
      #panel {
        position: fixed;
        z-index: 8;
        right: var(--edge);
        top: calc(var(--top) + var(--u) * 30);
        width: min(calc(var(--u) * 234), 46vw);
        max-height: calc(100dvh - var(--top) - var(--u) * 34 - var(--dock));
        display: flex;
        flex-direction: column;
      }
      #panel > .k-body {
        flex: 1;
        min-height: 0;
      }
      #panel.slide {
        animation: slide-in 0.18s ease-out;
      }
      @keyframes slide-in {
        from {
          translate: calc(var(--u) * 12) 0;
          opacity: 0;
        }
      }
      @keyframes slide-up {
        from {
          translate: 0 calc(var(--u) * 12);
          opacity: 0;
        }
      }
      /* The keeper nods while idle and hops when spoken for. */
      .nod canvas {
        animation: nod 2.4s steps(2) infinite;
      }
      .nod.hop canvas {
        animation: hop 0.3s;
      }
      @keyframes nod {
        50% {
          translate: 0 var(--u);
        }
      }
      @keyframes hop {
        50% {
          translate: 0 calc(var(--u) * -4);
        }
      }
      .quest {
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 2);
      }
      .quest.done {
        opacity: 0.65;
      }
      /* Each way to finish a quest, its bar over its count, side by side. */
      .quest .ways {
        display: flex;
        align-items: flex-start;
        gap: calc(var(--u) * 3);
      }
      .crabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: calc(var(--u) * 2);
      }
      .crabs .k-card {
        flex-direction: column;
        gap: var(--u);
        padding: calc(var(--u) * 2) 0;
        text-align: center;
      }
      .crabs .gap {
        height: calc(var(--u) * 16);
        font: var(--f-head);
        line-height: calc(var(--u) * 16);
      }

      /* The guild feed: what has just happened, said once and then gone. */
      #feed {
        position: fixed;
        z-index: 4;
        left: var(--edge);
        bottom: var(--bottom);
        width: min(calc(var(--u) * 170), calc(50vw - var(--slot) * 4.5 - var(--u) * 12));
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 2);
        pointer-events: none;
      }
      #feed .gone {
        opacity: 0;
        transition: opacity 0.9s;
      }

      /* The tray, while decorating: what is in hand, and everything put away. It takes the dock's place. */
      #tray {
        position: fixed;
        z-index: 7;
        left: 50%;
        translate: -50% 0;
        bottom: var(--bottom);
        width: min(calc(var(--u) * 250), calc(100vw - var(--edge) * 2));
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 2);
        padding: calc(var(--u) * 2);
      }
      #tray .bar {
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 3);
        min-height: calc(var(--u) * 16);
      }
      #tray .bar .name {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #tray .row {
        display: flex;
        align-items: center;
        gap: var(--u);
        min-height: calc(var(--u) * 30);
        overflow-x: auto;
        scrollbar-width: none;
      }
      #tray .row button {
        position: relative;
        flex: none;
        display: grid;
        place-items: center;
        width: calc(var(--u) * 30);
        height: calc(var(--u) * 30);
        padding: 0;
      }
      #tray .row button:active {
        translate: 0 var(--u);
      }
      #tray .row .n {
        position: absolute;
        right: calc(var(--u) * 2);
        bottom: 0;
        font: var(--f-name);
        color: var(--k-gold-lt);
        text-shadow: var(--u) var(--u) 0 var(--k-ink);
      }
      #tray .empty {
        padding: 0 calc(var(--u) * 2);
      }
      body.decorating #dock {
        display: none;
      }
      /* A letter out of the mailbox. */
      .note {
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 2);
      }
      .note hr {
        margin: var(--u) 0;
      }

      /* Somebody's card. */
      #card {
        position: fixed;
        z-index: 9;
        left: 50%;
        translate: -50% 0;
        bottom: calc(var(--dock) + var(--u) * 4);
        width: min(calc(var(--u) * 150), calc(100vw - var(--edge) * 2));
        box-sizing: border-box;
        padding: calc(var(--u) * 2);
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 3);
      }
      #card .top {
        align-items: flex-start;
      }

      /* Arrival: the letter, to one side so the member can watch themselves walk in through the gate. */
      #arrival {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: grid;
        place-items: center end;
        padding: var(--top) max(var(--edge), 5vw) var(--bottom);
        box-sizing: border-box;
        background: linear-gradient(90deg, #1a0f1e22 30%, #1a0f1ea8 100%);
        transition: opacity 0.3s;
      }
      #arrival.gone {
        opacity: 0;
        pointer-events: none;
      }
      .letter {
        width: min(calc(var(--u) * 180), 100%);
      }
      .letter .line {
        visibility: hidden;
      }
      .letter .line.in {
        visibility: visible;
        animation: line-in 0.3s steps(4);
      }
      @keyframes line-in {
        from {
          translate: calc(var(--u) * -6) 0;
          opacity: 0;
        }
      }
      .letter .faces {
        gap: var(--u);
      }
      .fly {
        position: fixed;
        z-index: 60;
        left: 0;
        top: 0;
        pointer-events: none;
      }

      /* A game, over the whole town. */
      #door {
        position: fixed;
        z-index: 40;
        inset: 0;
        display: grid;
        place-items: center;
        padding: var(--edge);
        box-sizing: border-box;
      }
      #door.dark {
        background: var(--k-ink);
      }
      .door-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        visibility: hidden;
      }
      .door-frame.open {
        visibility: visible;
      }
      .door-sign {
        animation: nod 0.8s steps(2) infinite;
      }
      .door-note {
        position: relative;
        width: min(calc(var(--u) * 170), 100%);
      }
      .door-note p {
        margin: calc(var(--u) * 3) 0 calc(var(--u) * 5);
      }

      /*
       * The Grove: its own picture over the town's, centred, and its words and buttons over that.
       * What is tied to the picture is placed in the picture's own pixels (--g, set with its size).
       */
      #grove {
        position: fixed;
        z-index: 12;
        inset: 0;
        background: #1a0f1e;
        touch-action: manipulation;
      }
      .grove-stage {
        position: absolute;
        overflow: hidden;
        --rim: calc(var(--g) * 8);
      }
      .grove-stage > canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .grove-banner {
        position: absolute;
        inset: 0;
        will-change: transform;
      }
      .grove-banner > *,
      .grove-skip,
      .grove-end,
      .grove-name,
      .grove-said,
      .grove-panel {
        position: absolute;
      }
      /* What Leaf refused, under the pools, in the one place that stays whatever is drawn again. */
      .grove-said {
        left: 50%;
        translate: -50% 0;
        top: calc(var(--g) * 30);
        max-width: 90%;
        text-align: center;
      }
      .tall .grove-said {
        top: calc(var(--g) * 82);
      }
      .grove-back {
        left: var(--rim);
        top: var(--rim);
      }
      #grove .grove-leaf {
        right: var(--rim);
        top: var(--rim);
        padding: var(--u) calc(var(--u) * 4);
      }
      .grove-skip {
        right: var(--rim);
        top: var(--rim);
      }
      .grove-pools {
        left: 50%;
        translate: -50% 0;
        top: var(--rim);
      }
      /* The pool's words and buttons: one column, the pulls at its foot. */
      .grove-words {
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 3);
      }
      #grove .grove-words .k-row {
        flex: none;
      }
      /* The pulls towards a top prize, a bar beside the count; under them, who is owed. */
      #grove .grove-pity {
        display: grid;
        grid-template-columns: auto calc(var(--u) * 40);
        align-items: center;
        gap: var(--u) calc(var(--u) * 4);
        padding: var(--u) calc(var(--u) * 4);
        white-space: nowrap;
      }
      .grove-pity .k-read {
        grid-column: 1 / -1;
      }
      .grove-pity b {
        color: var(--k-gold);
      }
      #grove .grove-pity .k-bar {
        height: calc(var(--u) * 6);
      }
      .grove-pulls {
        margin-top: auto;
      }
      /* A pull's button: what it is over what it costs, and its question in the same room. */
      .grove-pull,
      .grove-pull .k-asks > span {
        flex-direction: column;
        gap: var(--u);
      }
      #grove .grove-pull {
        min-width: calc(var(--u) * 62);
        padding-block: calc(var(--u) * 4) calc(var(--u) * 2);
      }
      #grove .grove-pull .k-cur,
      #grove .grove-pull .k-sub {
        padding: 0;
        background: none;
        font: var(--f-ui);
      }
      .grove-pulls {
        align-items: stretch;
      }
      /* At the end of a ceremony the same pull again is one line, to leave the picture its room. */
      #grove .grove-end .grove-pull,
      .grove-end .grove-pull .k-asks > span {
        flex-direction: row;
        gap: calc(var(--u) * 3);
        padding-block: 0;
      }
      .grove-end {
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 4);
        left: 50%;
        translate: -50% 0;
        bottom: var(--rim);
        will-change: transform;
      }
      /* A prize's name in the end picture, under it or over it, with its rarity's colour before it. */
      .grove-name {
        translate: -50% 0;
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 2);
        padding: var(--u) calc(var(--u) * 2);
        max-width: calc(var(--g) * 96);
        box-sizing: border-box;
        text-align: center;
        color: var(--k-cream);
        background: #1a0f1ecc;
        font: var(--f-ui);
      }
      /* On an upright screen the names are a column's width apart, and smaller. */
      .tall .grove-name {
        max-width: calc(var(--g) * 84);
        font: var(--f-small);
      }
      .grove-name.above {
        translate: -50% -100%;
      }
      .grove-name i {
        flex: none;
        width: calc(var(--u) * 3);
        height: calc(var(--u) * 3);
        background: var(--c);
      }
      .grove-rarity {
        flex: none;
        padding: var(--u) calc(var(--u) * 3);
        background: var(--c);
        color: #1a0f1e;
        font: var(--f-name);
      }
      .grove-panel {
        z-index: 2;
        display: flex;
        flex-direction: column;
      }
      .grove-panel > .k-body {
        flex: 1;
        min-height: 0;
      }
      .grove-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(calc(var(--u) * 48), 1fr));
        gap: var(--u);
      }
      .grove-past {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--u) calc(var(--u) * 3);
      }
      .grove-past > .k-read {
        flex-basis: 100%;
      }
      /* A wide screen: the words down the right of the picture, on its plum field. */
      .desk .grove-words {
        right: calc(var(--g) * 16);
        top: calc(var(--g) * 140);
        bottom: calc(var(--g) * 12);
        align-items: flex-end;
        text-align: right;
      }
      .desk .grove-panel {
        left: 50%;
        translate: -50% 0;
        top: calc(var(--g) * 26);
        bottom: calc(var(--g) * 10);
        width: min(calc(var(--u) * 270), 94%);
      }
      /* An upright screen: the words across its lower third. */
      .tall .grove-pools {
        top: calc(var(--g) * 60);
      }
      .tall .grove-words {
        left: 0;
        right: 0;
        top: calc(var(--g) * 416);
        bottom: calc(var(--g) * 8);
        align-items: center;
        text-align: center;
        gap: calc(var(--u) * 2);
      }
      #grove .tall .grove-pulls .grove-pull {
        padding-block: calc(var(--u) * 3) var(--u);
      }
      .tall .grove-panel {
        inset: calc(var(--g) * 44) calc(var(--g) * 2) calc(var(--g) * 6);
      }
      /* Three tabs and the way out fit its head with nothing to spare. */
      #grove .tall .grove-panel .k-head {
        gap: calc(var(--u) * 2);
        padding-inline: calc(var(--u) * 2);
      }
      #grove .tall .grove-panel .k-tabs > .k-btn {
        padding-inline: 0;
      }
      /* A row's button goes under its words where there is no room beside them. */
      .tall .grove-panel .k-card {
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .tall .grove-panel .k-card > .k-grow {
        flex-basis: calc(var(--u) * 100);
      }

      /* Inside a game the town's interface is put away, and comes back after. */
      #top,
      #corner,
      #dock,
      #feed {
        transition: translate 0.25s steps(5);
      }
      .inside #top,
      .inside #corner {
        translate: 0 calc(var(--u) * -40);
      }
      .inside #dock {
        translate: -50% calc(var(--u) * 50);
      }
      .inside #feed {
        translate: 0 calc(var(--u) * 50);
      }
      .inside #panel,
      .inside #card,
      .inside #tray {
        display: none;
      }

      /* What a tome request is for, typed at the Treasury, across its row. 16px at least, or a phone zooms in on it. */
      .k-card:has(> .k-field) {
        flex-wrap: wrap;
      }
      .k-field {
        box-sizing: border-box;
        flex-basis: 100%;
        padding: calc(var(--u) * 2) calc(var(--u) * 3);
        border: var(--u) solid var(--k-faint);
        background: var(--k-ink);
        color: var(--k-cream);
        font: var(--f-typed);
        resize: none;
      }
      .k-field:focus {
        outline: none;
        border-color: var(--k-gold);
      }
      .k-field::placeholder {
        color: var(--k-faint);
      }

      @media (max-width: 1100px), (orientation: portrait) {
        #feed {
          bottom: calc(var(--dock) + var(--u) * 4);
          width: min(calc(var(--u) * 170), calc(100vw - var(--edge) * 2));
        }
        body.decorating #feed {
          bottom: calc(var(--u) * 68 + var(--bottom));
        }
      }
      /* On a short screen there is no room for news and the tray both. */
      @media (max-height: 500px) {
        body.decorating #feed {
          display: none;
        }
      }
      @media (max-width: 700px), (orientation: portrait) {
        #arrival {
          place-items: end center;
          padding-inline: var(--edge);
          background: linear-gradient(180deg, #1a0f1e11 35%, #1a0f1eb8 100%);
        }
        #panel {
          left: var(--edge);
          right: var(--edge);
          width: auto;
          top: auto;
          bottom: calc(var(--dock) + var(--u) * 2);
          max-height: min(52dvh, calc(100dvh - var(--dock) - var(--top) - var(--u) * 30));
        }
        #panel.slide {
          animation-name: slide-up;
        }
        /* Too narrow for two ways side by side: each on a line of its own, its bar and then its count. */
        .quest .ways.apart {
          display: grid;
          grid-template-columns: 1fr auto;
          align-items: center;
          gap: var(--u) calc(var(--u) * 3);
        }
        .quest .ways.apart > .k-col {
          display: contents;
        }
        .quest .ways.apart > .k-label {
          grid-column: 1 / -1;
        }
        .quest .ways.apart .k-dim {
          white-space: nowrap;
        }
        /* A row's button goes under its words where there is no room for a whole name beside it. */
        #panel .k-card {
          flex-wrap: wrap;
        }
        #panel .k-card > .k-grow {
          flex-basis: calc(var(--u) * 100);
        }
        #panel .k-card > .k-btn {
          margin-left: auto;
        }
        #purse {
          gap: calc(var(--u) * 4);
        }
        #feed > :nth-last-child(n + 3),
        body.panel-open #feed,
        body.decorating #feed {
          display: none;
        }
        /* The tray's buttons are their pictures alone, so that the name of the thing in hand has room. */
        #tray .bar .t {
          display: none;
        }
      }
    </style>
  </head>
