<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Guild Town</title>
    <style>
      :root {
        --plum: #2a1733;
        --mid: #3d2050;
        --edge: #5a296e;
        --ink: #1a0f1e;
        --gold: #f5b95e;
        --cream: #fff3cf;
        --dim: #cdb6d8;
        --leaf: #c9ef9a;
        --coral: #e67967;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--ink);
        overflow: hidden;
        font:
          600 13px/1.3 ui-monospace,
          "DejaVu Sans Mono",
          Menlo,
          Consolas,
          monospace;
        color: var(--cream);
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        display: block;
        touch-action: none;
        image-rendering: pixelated;
        cursor: pointer;
      }
      canvas.px {
        image-rendering: pixelated;
        display: block;
        flex: none;
      }
      [hidden] {
        display: none !important;
      }
      .plum {
        background: #2a1733f4;
        border: 2px solid var(--edge);
        box-shadow:
          0 0 0 2px var(--ink),
          0 5px 0 #0007;
        border-radius: 3px;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }

      /* The purse, top left: Leaf first, because it is the precious one. */
      #purse {
        position: fixed;
        z-index: 5;
        top: max(8px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
        display: flex;
        gap: 14px;
        padding: 5px 12px 5px 8px;
      }
      .cur {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .cur b {
        display: block;
        font-size: 19px;
        line-height: 1;
        min-width: 3ch;
      }
      .cur small {
        display: block;
        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--dim);
      }
      #leaf b {
        color: var(--leaf);
      }
      #coins b {
        color: var(--gold);
      }
      .cur.bump canvas {
        animation: bump 0.22s;
      }
      @keyframes bump {
        50% {
          transform: scale(1.3) rotate(-8deg);
        }
      }

      #corner {
        position: fixed;
        z-index: 5;
        top: max(8px, env(safe-area-inset-top));
        right: max(8px, env(safe-area-inset-right));
        display: flex;
        gap: 8px;
      }
      #corner button {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        padding: 0;
      }
      #corner button:active,
      #dock button:active {
        transform: translateY(2px);
      }

      /* The dock: every place, one touch away. */
      #dock {
        position: fixed;
        z-index: 6;
        left: 50%;
        transform: translateX(-50%);
        bottom: max(8px, env(safe-area-inset-bottom));
        display: flex;
        gap: 5px;
        padding: 5px;
      }
      #dock button {
        width: 58px;
        height: 54px;
        padding: 0;
        display: grid;
        justify-items: center;
        align-content: center;
        gap: 2px;
        background: var(--mid);
        border: 2px solid var(--edge);
        border-radius: 2px;
      }
      #dock button small {
        font-size: 9px;
        color: var(--dim);
        letter-spacing: 0.02em;
      }
      #dock button.on {
        border-color: var(--gold);
        background: #54286a;
      }
      #dock button.on small {
        color: var(--gold);
      }
      #dock button:hover canvas {
        animation: bump 0.22s;
      }

      /* A place's panel: beside the town on a wide screen, under it on a tall one. */
      #panel {
        position: fixed;
        z-index: 8;
        right: max(10px, env(safe-area-inset-right));
        top: 62px;
        bottom: 84px;
        width: min(364px, 46vw);
        display: flex;
        flex-direction: column;
        animation: slide-in 0.18s ease-out;
      }
      @keyframes slide-in {
        from {
          transform: translateX(26px);
          opacity: 0;
        }
      }
      @keyframes slide-up {
        from {
          transform: translateY(26px);
          opacity: 0;
        }
      }
      #panel header {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 8px 7px 10px;
        border-bottom: 2px solid var(--edge);
      }
      #panel h2 {
        margin: 0;
        flex: 1;
        font-size: 16px;
        color: var(--gold);
      }
      #panel .x {
        width: 34px;
        height: 34px;
        background: var(--mid);
        border: 2px solid var(--edge);
        border-radius: 2px;
        font-size: 16px;
        line-height: 1;
      }
      #panel .body {
        flex: 1;
        overflow: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        scrollbar-width: thin;
        scrollbar-color: var(--edge) transparent;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        background: var(--mid);
        border: 2px solid var(--edge);
        border-radius: 2px;
        padding: 7px 8px;
      }
      .row.done {
        opacity: 0.7;
      }
      .row.lit {
        border-color: var(--gold);
        background: #54286a;
      }
      .row.missing {
        border-color: var(--coral);
        border-style: dashed;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .d {
        font-size: 11px;
        font-weight: 500;
        color: var(--dim);
      }
      .note {
        font-size: 11px;
        font-weight: 500;
        color: var(--dim);
        padding: 0 2px;
      }
      .price {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--leaf);
        white-space: nowrap;
      }
      .price.coin {
        color: var(--gold);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 36px;
        padding: 5px 11px;
        white-space: nowrap;
        color: var(--plum);
        background: var(--gold);
        border: 2px solid #ffd98a;
        border-radius: 2px;
        box-shadow: 0 3px 0 #a3662a;
      }
      .btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 #a3662a;
      }
      .btn.plain {
        color: var(--cream);
        background: var(--edge);
        border-color: #7a348a;
        box-shadow: 0 3px 0 var(--ink);
      }
      .btn.shake {
        animation: shake 0.3s;
      }
      @keyframes shake {
        20%,
        60% {
          transform: translateX(-4px);
        }
        40%,
        80% {
          transform: translateX(4px);
        }
      }
      .bar {
        height: 8px;
        margin-top: 5px;
        background: var(--ink);
        border: 2px solid var(--edge);
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--gold);
        transition: width 0.4s;
      }
      .stamp {
        color: var(--leaf);
        border: 2px solid #62a658;
        border-radius: 2px;
        padding: 4px 8px;
        transform: rotate(-4deg);
        animation: stamp 0.25s cubic-bezier(0.2, 1.6, 0.4, 1);
      }
      @keyframes stamp {
        from {
          transform: rotate(-4deg) scale(2.2);
          opacity: 0;
        }
      }
      .keeper {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }
      .keeper canvas {
        animation: nod 2.4s ease-in-out infinite;
      }
      .keeper.hop canvas {
        animation: hop 0.3s;
      }
      @keyframes nod {
        50% {
          transform: translateY(2px);
        }
      }
      @keyframes hop {
        50% {
          transform: translateY(-9px);
        }
      }
      .says {
        flex: 1;
        position: relative;
        background: var(--cream);
        color: var(--ink);
        border-radius: 2px;
        padding: 7px 9px;
        box-shadow: 0 0 0 2px var(--ink);
      }
      .says::before {
        content: "";
        position: absolute;
        left: -8px;
        bottom: 9px;
        border: 5px solid transparent;
        border-right-color: var(--cream);
      }
      .says b {
        display: block;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7a348a;
      }
      .wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .who {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--mid);
        border: 2px solid var(--edge);
        border-radius: 2px;
        padding: 4px 8px 4px 4px;
      }
      .frame {
        flex: 1;
        min-height: 230px;
        border: 2px solid var(--edge);
        background: #1b1220;
      }
      .frame iframe {
        width: 100%;
        height: 100%;
        min-height: 230px;
        border: 0;
        display: block;
      }
      .big {
        font-size: 18px;
        color: var(--gold);
      }
      .track {
        display: flex;
        gap: 4px;
      }
      .track span {
        flex: 1;
        text-align: center;
        font-size: 9px;
        padding: 4px 0;
        background: var(--ink);
        border: 2px solid var(--edge);
        color: var(--dim);
      }
      .track span.at {
        border-color: var(--gold);
        color: var(--plum);
        background: var(--gold);
      }
      .track span.past {
        color: var(--cream);
        background: var(--edge);
      }

      /* The guild feed: what has just happened, said once and then gone. */
      #feed {
        position: fixed;
        z-index: 4;
        left: max(8px, env(safe-area-inset-left));
        bottom: 82px;
        width: min(320px, 76vw);
        display: flex;
        flex-direction: column;
        gap: 4px;
        pointer-events: none;
      }
      #feed div {
        background: #1a0f1ee0;
        border-left: 3px solid var(--gold);
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 500;
        animation:
          feed-in 0.3s,
          feed-out 1s 12s forwards;
      }
      #feed .leaf,
      #feed .level {
        border-left-color: #62a658;
      }
      #feed .crab,
      #feed .raid {
        border-left-color: var(--coral);
      }
      #feed .land {
        border-left-color: #b84d84;
      }
      @keyframes feed-in {
        from {
          transform: translateX(-14px);
          opacity: 0;
        }
      }
      @keyframes feed-out {
        to {
          opacity: 0;
        }
      }

      /* A guild-mate's card. */
      #card {
        position: fixed;
        z-index: 9;
        left: 50%;
        transform: translateX(-50%);
        bottom: 84px;
        width: min(300px, 86vw);
        padding: 9px 10px 10px;
        animation: slide-up 0.16s ease-out;
      }
      #card .top {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 8px;
      }
      #card .x {
        margin-left: auto;
        width: 30px;
        height: 30px;
        background: var(--mid);
        border: 2px solid var(--edge);
        border-radius: 2px;
      }

      /* Arrival: while you were away. */
      #arrival {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: grid;
        /* To one side, so the member can watch themselves walk in through the gate. */
        place-items: center end;
        padding: 0 max(18px, 5vw);
        box-sizing: border-box;
        background: linear-gradient(90deg, #1a0f1e22 30%, #1a0f1ea8 100%);
        transition: opacity 0.3s;
      }
      #arrival.gone {
        opacity: 0;
        pointer-events: none;
      }
      #arrival .sheet {
        width: min(404px, 92vw);
        box-sizing: border-box;
        padding: 14px 16px 16px;
        animation: rise 0.4s cubic-bezier(0.2, 1.3, 0.4, 1);
      }
      @keyframes rise {
        from {
          transform: translateY(30px) scale(0.96);
          opacity: 0;
        }
      }
      #arrival h1 {
        margin: 0;
        font-size: 22px;
        color: var(--gold);
      }
      #arrival p {
        margin: 2px 0 8px;
        font-weight: 500;
        color: var(--dim);
      }
      #arrival .line {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 0;
        border-top: 2px dotted var(--edge);
        opacity: 0;
        animation: line-in 0.3s forwards;
      }
      @keyframes line-in {
        from {
          transform: translateX(-10px);
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      #arrival .line b {
        color: var(--gold);
      }
      #arrival .line.leaf b {
        color: var(--leaf);
      }
      #arrival .btn {
        width: 100%;
        margin-top: 8px;
        min-height: 44px;
        font-size: 15px;
      }
      .fly {
        position: fixed;
        z-index: 30;
        left: 0;
        top: 0;
        pointer-events: none;
      }

      @media (max-width: 700px), (orientation: portrait) {
        #arrival {
          place-items: end center;
          padding: 0 0 max(16px, env(safe-area-inset-bottom));
          background: linear-gradient(180deg, #1a0f1e11 35%, #1a0f1eb8 100%);
        }
        #panel {
          left: 8px;
          right: 8px;
          width: auto;
          top: auto;
          bottom: 72px;
          max-height: min(50dvh, 430px);
          animation-name: slide-up;
        }
        #dock {
          gap: 3px;
          padding: 4px;
        }
        #dock button {
          width: 47px;
          height: 46px;
        }
        #dock button small {
          display: none;
        }
        #feed {
          bottom: 70px;
          width: min(300px, 74vw);
        }
        body.panel-open #feed {
          display: none;
        }
        #card {
          bottom: 70px;
        }
        .cur small {
          display: none;
        }
        .cur b {
          min-width: 2ch;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="purse" class="plum"></div>
    <div id="corner"></div>
    <div id="feed"></div>
    <nav id="dock" class="plum"></nav>
    <aside id="panel" class="plum" hidden></aside>
    <div id="card" class="plum" hidden></div>
    <div id="arrival"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
