<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Guild Town</title>
    <link rel="stylesheet" href="../../packages/kit/src/kit.css" />
    <style>
      /* Only where the town puts things; how they look is the kit's. */
      :root {
        --edge: max(calc(var(--u) * 4), env(safe-area-inset-left), env(safe-area-inset-right));
        --top: max(calc(var(--u) * 4), env(safe-area-inset-top));
        --bottom: max(calc(var(--u) * 4), env(safe-area-inset-bottom));
        /* The dock: a slot's side, and how tall the whole plank stands off the bottom. */
        --slot: min(calc(var(--u) * 21), calc((100vw - var(--u) * 26) / 8));
        --dock: calc(var(--u) * 31 + var(--bottom));
        --sheet-floor: var(--dock);
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        display: block;
        touch-action: none;
        image-rendering: pixelated;
      }

      /* Top left: the purse, Leaf first, because it is the precious one; beside it, who is about. */
      /* Where there is no room beside the purse for the corner's buttons too, who is about goes under it. */
      #top {
        position: fixed;
        z-index: 5;
        top: var(--top);
        left: var(--edge);
        max-width: calc(100vw - var(--edge) * 2 - var(--u) * 50);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: calc(var(--u) * 2) calc(var(--u) * 3);
      }
      #purse {
        display: flex;
        gap: calc(var(--u) * 6);
        padding: var(--u) calc(var(--u) * 4);
      }
      #about {
        padding-inline: calc(var(--u) * 4);
      }
      /* At somebody else's camp, on a line of its own under the purse: whose camp it is, and the way home. */
      #visit {
        flex-basis: 100%;
      }
      #visit[hidden] {
        display: none;
      }
      /* Its line has no corner buttons beside it: it may be as wide as the screen. */
      #visit > .k-plaque {
        display: inline-flex;
        align-items: center;
        gap: calc(var(--u) * 3);
        width: max-content;
        max-width: calc(100vw - var(--edge) * 2);
        box-sizing: border-box;
        padding: var(--u) calc(var(--u) * 3);
      }
      /* Who is about: a part for each, a row for each person, their face, name and rank. */
      .about {
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 2);
      }
      .about-part {
        display: flex;
        flex-direction: column;
        gap: var(--u);
        margin-bottom: calc(var(--u) * 2);
      }
      button.about-row {
        display: flex;
        gap: calc(var(--u) * 4);
        width: 100%;
        min-height: calc(var(--u) * 20);
        padding: var(--u) calc(var(--u) * 2);
        box-sizing: border-box;
        background: none;
        border: 0;
        color: inherit;
        font: var(--f-ui);
        text-align: left;
        cursor: pointer;
      }
      button.about-row:hover,
      button.about-row:focus-visible {
        background: #f5b95e1f;
      }
      button.about-row:active {
        translate: 0 var(--u);
      }
      .about-row.gone {
        opacity: 0.45;
      }
      .about-row .k-thing-pic {
        min-width: calc(var(--u) * 18);
      }
      .about-who {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .about-who .k-thing-name {
        color: var(--k-cream);
      }
      .about-who > * {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* Under the purse while the town's live connection is down, on a line of its own. */
      #link {
        flex-basis: 100%;
        pointer-events: none;
      }
      #link > span {
        display: inline-block;
        padding: 0 calc(var(--u) * 3);
      }
      /* The member's emotes, over their own head, the picture of each one to choose. */
      #emotes {
        position: fixed;
        z-index: 9;
        translate: -50% -100%;
        display: flex;
        gap: var(--u);
        padding: var(--u);
      }
      #emotes .k-btn {
        min-width: calc(var(--u) * 20);
        min-height: calc(var(--u) * 20);
      }
      #corner {
        position: fixed;
        z-index: 5;
        top: var(--top);
        right: var(--edge);
        display: flex;
        gap: calc(var(--u) * 3);
      }

      /* The dock: every place, one touch away. */
      #dock {
        position: fixed;
        z-index: 6;
        left: 50%;
        translate: -50% 0;
        bottom: var(--bottom);
        display: flex;
        gap: var(--u);
        padding: var(--u);
      }
      #dock button {
        width: var(--slot);
        height: calc(var(--u) * 21);
        padding: 0;
        background: none;
      }
      #dock button:hover canvas,
      #dock button.lit canvas {
        translate: 0 calc(var(--u) * -1);
      }
      #dock button:active {
        translate: 0 var(--u);
      }

      /* A place's panel: beside the town on a wide screen, under it on a tall one. */
      #panel {
        position: fixed;
        z-index: 8;
        right: var(--edge);
        top: calc(var(--top) + var(--u) * 30);
        width: min(calc(var(--u) * 230), 46vw);
        max-height: calc(100dvh - var(--top) - var(--u) * 34 - var(--dock));
        display: flex;
        flex-direction: column;
      }
      #panel > .k-body {
        flex: 1;
        min-height: 0;
      }
      #panel.slide {
        animation: slide-in 0.18s ease-out;
      }
      @keyframes slide-in {
        from {
          translate: calc(var(--u) * 12) 0;
          opacity: 0;
        }
      }
      @keyframes slide-up {
        from {
          translate: 0 calc(var(--u) * 12);
          opacity: 0;
        }
      }
      /* The keeper nods while idle and hops when spoken for. */
      .nod canvas {
        animation: nod 2.4s steps(2) infinite;
      }
      .nod.hop canvas {
        animation: hop 0.3s;
      }
      @keyframes nod {
        50% {
          translate: 0 var(--u);
        }
      }
      @keyframes hop {
        50% {
          translate: 0 calc(var(--u) * -4);
        }
      }
      .quest {
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 2);
      }
      .quest.done {
        opacity: 0.65;
      }
      .crabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: calc(var(--u) * 2);
      }
      .crabs .k-card {
        flex-direction: column;
        gap: var(--u);
        padding: calc(var(--u) * 2) 0;
        text-align: center;
      }
      .crabs .gap {
        height: calc(var(--u) * 16);
        font: var(--f-head);
        line-height: calc(var(--u) * 16);
      }

      /* The guild feed: what has just happened, said once and then gone. */
      #feed {
        position: fixed;
        z-index: 4;
        left: var(--edge);
        bottom: var(--bottom);
        width: min(calc(var(--u) * 170), calc(50vw - var(--slot) * 4 - var(--u) * 12));
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 2);
        pointer-events: none;
      }
      #feed .gone {
        opacity: 0;
        transition: opacity 0.9s;
      }

      /* The tray, while decorating: what is in hand, and everything put away. It takes the dock's place. */
      #tray {
        position: fixed;
        z-index: 7;
        left: 50%;
        translate: -50% 0;
        bottom: var(--bottom);
        width: min(calc(var(--u) * 250), calc(100vw - var(--edge) * 2));
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 2);
        padding: calc(var(--u) * 2);
      }
      #tray .bar {
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 3);
        min-height: calc(var(--u) * 16);
      }
      #tray .bar .name {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #tray .row {
        display: flex;
        align-items: center;
        gap: var(--u);
        min-height: calc(var(--u) * 30);
        overflow-x: auto;
        scrollbar-width: none;
      }
      #tray .row button {
        position: relative;
        flex: none;
        display: grid;
        place-items: center;
        width: calc(var(--u) * 30);
        height: calc(var(--u) * 30);
        padding: 0;
      }
      #tray .row button:active {
        translate: 0 var(--u);
      }
      #tray .row .n {
        position: absolute;
        right: calc(var(--u) * 2);
        bottom: 0;
        font: var(--f-name);
        color: var(--k-gold-lt);
        text-shadow: var(--u) var(--u) 0 var(--k-ink);
      }
      #tray .empty {
        padding: 0 calc(var(--u) * 2);
      }
      body.decorating #dock {
        display: none;
      }
      /* A letter out of the mailbox. */
      .note {
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 2);
      }
      .note hr {
        margin: var(--u) 0;
      }

      /* Somebody's card. */
      #card {
        position: fixed;
        z-index: 9;
        left: 50%;
        translate: -50% 0;
        bottom: calc(var(--dock) + var(--u) * 4);
        width: min(calc(var(--u) * 150), calc(100vw - var(--edge) * 2));
        box-sizing: border-box;
        padding: calc(var(--u) * 2);
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 3);
      }
      #card .top {
        align-items: flex-start;
      }

      /* Arrival: the letter, to one side so the member can watch themselves walk in through the gate. */
      #arrival {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: grid;
        place-items: center end;
        padding: var(--top) max(var(--edge), 5vw) var(--bottom);
        box-sizing: border-box;
        background: linear-gradient(90deg, #1a0f1e22 30%, #1a0f1ea8 100%);
        transition: opacity 0.3s;
      }
      #arrival.gone {
        opacity: 0;
        pointer-events: none;
      }
      .letter {
        width: min(calc(var(--u) * 180), 100%);
      }
      .letter .line {
        visibility: hidden;
      }
      .letter .line.in {
        visibility: visible;
        animation: line-in 0.3s steps(4);
      }
      @keyframes line-in {
        from {
          translate: calc(var(--u) * -6) 0;
          opacity: 0;
        }
      }
      .letter .faces {
        gap: var(--u);
      }
      .fly {
        position: fixed;
        z-index: 60;
        left: 0;
        top: 0;
        pointer-events: none;
      }

      /* A game, over the whole town. */
      #door {
        position: fixed;
        z-index: 40;
        inset: 0;
        display: grid;
        place-items: center;
        padding: var(--edge);
        box-sizing: border-box;
      }
      #door.dark {
        background: var(--k-ink);
      }
      .door-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        visibility: hidden;
      }
      .door-frame.open {
        visibility: visible;
      }
      .door-sign {
        animation: nod 0.8s steps(2) infinite;
      }
      .door-note {
        position: relative;
        width: min(calc(var(--u) * 170), 100%);
      }
      .door-note p {
        margin: calc(var(--u) * 3) 0 calc(var(--u) * 5);
      }

      /* Inside a game the town's interface is put away, and comes back after. */
      #top,
      #corner,
      #dock,
      #feed {
        transition: translate 0.25s steps(5);
      }
      .inside #top,
      .inside #corner {
        translate: 0 calc(var(--u) * -40);
      }
      .inside #dock {
        translate: -50% calc(var(--u) * 50);
      }
      .inside #feed {
        translate: 0 calc(var(--u) * 50);
      }
      .inside #panel,
      .inside #card,
      .inside #tray {
        display: none;
      }

      /* What a tome request is for, typed at the Treasury, across its row. 16px at least, or a phone zooms in on it. */
      .k-card:has(> .k-field) {
        flex-wrap: wrap;
      }
      .k-field {
        box-sizing: border-box;
        flex-basis: 100%;
        padding: calc(var(--u) * 2) calc(var(--u) * 3);
        border: var(--u) solid var(--k-faint);
        background: var(--k-ink);
        color: var(--k-cream);
        font: var(--f-typed);
        resize: none;
      }
      .k-field:focus {
        outline: none;
        border-color: var(--k-gold);
      }
      .k-field::placeholder {
        color: var(--k-faint);
      }

      @media (max-width: 1100px), (orientation: portrait) {
        #feed {
          bottom: calc(var(--dock) + var(--u) * 4);
          width: min(calc(var(--u) * 170), calc(100vw - var(--edge) * 2));
        }
        body.decorating #feed {
          bottom: calc(var(--u) * 68 + var(--bottom));
        }
      }
      /* On a short screen there is no room for news and the tray both. */
      @media (max-height: 500px) {
        body.decorating #feed {
          display: none;
        }
      }
      @media (max-width: 700px), (orientation: portrait) {
        #arrival {
          place-items: end center;
          padding-inline: var(--edge);
          background: linear-gradient(180deg, #1a0f1e11 35%, #1a0f1eb8 100%);
        }
        #panel {
          left: var(--edge);
          right: var(--edge);
          width: auto;
          top: auto;
          bottom: calc(var(--dock) + var(--u) * 2);
          max-height: min(52dvh, calc(100dvh - var(--dock) - var(--top) - var(--u) * 30));
        }
        #panel.slide {
          animation-name: slide-up;
        }
        /* A row's button goes under its words where there is no room for a whole name beside it. */
        #panel .k-card {
          flex-wrap: wrap;
        }
        #panel .k-card > .k-grow {
          flex-basis: calc(var(--u) * 100);
        }
        #panel .k-card > .k-btn {
          margin-left: auto;
        }
        #purse {
          gap: calc(var(--u) * 4);
        }
        #feed > :nth-last-child(n + 3),
        body.panel-open #feed,
        body.decorating #feed {
          display: none;
        }
        /* The tray's buttons are their pictures alone, so that the name of the thing in hand has room. */
        #tray .bar .t {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="top">
      <div id="purse" class="k-plaque"></div>
      <div id="visit" hidden></div>
    </div>
    <div id="corner"></div>
    <div id="feed" aria-live="polite"></div>
    <nav id="dock" class="k-plaque" aria-label="Places"></nav>
    <div id="tray" class="k-plaque" aria-label="Things put away" hidden></div>
    <aside id="panel" class="k-panel" hidden></aside>
    <div id="card" class="k-plaque" hidden></div>
    <div id="arrival" hidden></div>
    <div id="door" hidden></div>
    <script type="module" src="./src/open.ts"></script>
  </body>
</html>
