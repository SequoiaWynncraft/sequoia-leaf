<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Your Camp</title>
    <style>
      :root {
        --plum: #2a1733;
        --plum2: #3d2050;
        --edge: #5a296e;
        --gold: #f5b95e;
        --gold2: #ffd98a;
        --cream: #fff3cf;
        --dim: #cdb6d6;
        --ink: #1a0f1e;
        --coral: #e67967;
        --green: #62a658;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--ink);
        overflow: hidden;
        font:
          600 13px/1.3 ui-monospace,
          "DejaVu Sans Mono",
          Menlo,
          Consolas,
          monospace;
        color: var(--cream);
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #scene {
        position: fixed;
        left: 0;
        top: 0;
        display: block;
        image-rendering: pixelated;
        touch-action: none;
      }
      canvas.px {
        image-rendering: pixelated;
        display: block;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .panel {
        background: #2a1733f4;
        border: 2px solid var(--edge);
        box-shadow:
          0 0 0 2px var(--ink),
          0 5px 0 2px #0006;
        border-radius: 2px;
      }
      .b {
        background: var(--plum2);
        border: 2px solid var(--edge);
        box-shadow: 0 2px 0 var(--ink);
        padding: 7px 12px;
        min-height: 38px;
        border-radius: 2px;
        color: var(--cream);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .b:active {
        transform: translateY(2px);
        box-shadow: none;
      }
      .b.gold {
        background: var(--gold);
        border-color: var(--gold2);
        color: var(--ink);
      }
      .b[disabled] {
        opacity: 0.5;
        cursor: default;
      }
      .b.shake {
        animation: shake 0.3s;
      }
      @keyframes shake {
        25% {
          transform: translateX(-4px);
        }
        75% {
          transform: translateX(4px);
        }
      }

      /* ---- the top of the screen ---- */
      #hud {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 0
          max(8px, env(safe-area-inset-left));
        display: flex;
        gap: 6px 8px;
        align-items: flex-start;
        flex-wrap: wrap;
        pointer-events: none;
        z-index: 3;
      }
      #hud > * {
        pointer-events: auto;
      }
      #purse {
        display: flex;
        gap: 14px;
        padding: 5px 10px;
        align-items: center;
        min-height: 26px;
      }
      .cur {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 17px;
      }
      .cur.pulse {
        animation: pulse 0.22s;
      }
      @keyframes pulse {
        50% {
          transform: scale(1.22);
        }
      }
      #leaf {
        color: var(--gold);
      }
      #mates {
        display: flex;
        gap: 4px;
        margin-left: auto;
      }
      #where:not([hidden]) + #mates {
        margin-left: 0;
      }
      .mate {
        position: relative;
        width: 30px;
        height: 36px;
        padding: 0;
        cursor: pointer;
        background: var(--plum);
        border: 2px solid var(--edge);
        box-shadow: 0 0 0 1px var(--ink);
        border-radius: 2px;
        display: grid;
        place-items: end center;
      }
      .mate canvas {
        margin-bottom: 2px;
      }
      .mate.away canvas {
        opacity: 0.6;
      }
      .mate.here::after {
        content: "";
        position: absolute;
        right: -4px;
        bottom: -4px;
        width: 7px;
        height: 7px;
        background: var(--green);
        border: 2px solid var(--ink);
      }
      #btns {
        display: flex;
        gap: 4px;
      }
      .ib {
        width: 38px;
        height: 36px;
        min-height: 0;
        padding: 0;
        font-size: 16px;
      }
      .ib.on {
        background: var(--gold);
        border-color: var(--gold2);
      }
      #where {
        padding: 4px 10px;
        display: flex;
        gap: 10px;
        align-items: center;
        white-space: nowrap;
        margin: 0 auto;
        animation: pop 0.2s ease-out;
      }
      #where b {
        color: var(--gold);
      }
      #where .b {
        min-height: 26px;
        padding: 2px 9px;
      }
      @media (max-width: 640px) {
        #mates {
          order: 3;
          width: 100%;
          margin-left: 0;
        }
        #btns {
          margin-left: auto;
        }
        #where {
          order: 4;
          margin-left: 0;
        }
      }

      /* ---- words in the scene ---- */
      .bubble {
        position: fixed;
        left: 0;
        top: 0;
        transform: translate(-50%, -100%);
        background: var(--cream);
        color: var(--ink);
        padding: 3px 7px 4px;
        border: 2px solid var(--ink);
        border-radius: 2px;
        font-size: 12px;
        line-height: 1.2;
        max-width: 160px;
        width: max-content;
        text-align: center;
        pointer-events: none;
        box-shadow: 0 2px 0 #0005;
        z-index: 1;
        animation: say 0.14s ease-out;
      }
      .bubble::after {
        content: "";
        position: absolute;
        left: calc(50% - 3px);
        bottom: -6px;
        width: 6px;
        height: 4px;
        background: var(--ink);
      }
      .bubble b {
        display: block;
        color: #7a348a;
        font-size: 9px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      @keyframes say {
        from {
          opacity: 0;
          margin-top: 6px;
        }
      }
      .tag {
        position: fixed;
        left: 0;
        top: 0;
        transform: translate(-50%, -100%);
        background: #1a0f1ed9;
        color: var(--gold2);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 2px 6px;
        border-bottom: 2px solid var(--gold);
        pointer-events: none;
        white-space: nowrap;
        z-index: 1;
      }
      #feed {
        order: 9;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
        pointer-events: none !important;
      }
      .news {
        background: #1a0f1ed9;
        border-left: 3px solid var(--gold);
        padding: 4px 8px;
        font-size: 12px;
        max-width: min(400px, calc(100vw - 32px));
        animation: news 10s forwards;
      }
      .news.soft {
        border-left-color: var(--edge);
        color: var(--dim);
        animation-duration: 4.5s;
      }
      @keyframes news {
        0% {
          opacity: 0;
          transform: translateX(-12px);
        }
        4% {
          opacity: 1;
          transform: none;
        }
        86% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      /* ---- panels ---- */
      #panel {
        position: fixed;
        right: max(12px, env(safe-area-inset-right));
        top: 60px;
        width: min(350px, calc(100vw - 24px));
        max-height: calc(100dvh - 76px);
        display: flex;
        flex-direction: column;
        z-index: 6;
        animation: pop 0.16s ease-out;
      }
      #panel header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 8px 7px 10px;
        border-bottom: 2px solid var(--edge);
      }
      #panel h2 {
        margin: 0;
        font-size: 15px;
        color: var(--gold);
        flex: 1;
      }
      #pbody {
        padding: 10px;
        overflow: auto;
        display: grid;
        gap: 7px;
      }
      @keyframes pop {
        from {
          opacity: 0;
          scale: 0.94;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          translate: 0 24px;
        }
      }
      @media (max-width: 640px) {
        #panel {
          left: 8px;
          right: 8px;
          top: auto;
          bottom: max(8px, env(safe-area-inset-bottom));
          width: auto;
          max-height: 54dvh;
          animation: rise 0.18s ease-out;
        }
        #panel.lefty {
          left: 8px;
          right: 8px;
        }
      }
      .row {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 9px;
        align-items: center;
        background: #3d205099;
        border: 1px solid var(--edge);
        padding: 7px 8px;
        animation: rise 0.25s ease-out backwards;
      }
      .still .row,
      .still .roll div {
        animation: none;
      }
      #panel.lefty {
        right: auto;
        left: max(12px, env(safe-area-inset-left));
      }
      .row small,
      .note {
        display: block;
        color: var(--dim);
        font-weight: 500;
        font-size: 11px;
      }
      .amt {
        color: var(--gold);
        font-size: 15px;
        display: inline-flex;
        gap: 4px;
        align-items: center;
        white-space: nowrap;
      }
      .bar {
        height: 8px;
        background: var(--ink);
        border: 1px solid var(--edge);
        margin-top: 4px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--gold);
        transition: width 0.4s;
      }
      .talk {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px;
        align-items: center;
      }
      .talk p {
        margin: 0;
        background: var(--cream);
        color: var(--ink);
        padding: 6px 8px;
        border: 2px solid var(--ink);
      }
      .talk p b {
        display: block;
        color: #7a348a;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .roll {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 4px;
      }
      .roll div {
        padding: 4px 6px;
        background: #3d205099;
        border: 1px solid var(--edge);
        font-size: 12px;
        animation: rise 0.2s ease-out backwards;
      }
      .roll div.gone {
        border-color: var(--coral);
        color: var(--coral);
      }
      .roll small {
        display: block;
        font-weight: 500;
        font-size: 10px;
        color: var(--dim);
      }
      .roll .gone small {
        color: var(--coral);
      }
      .stat {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 3px 0;
        border-bottom: 1px dashed var(--edge);
      }
      .stat span:last-child {
        color: var(--gold);
      }
      .who {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .who span {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        background: #3d205099;
        border: 1px solid var(--edge);
        padding: 3px 7px 3px 4px;
      }
      .card {
        position: fixed;
        z-index: 5;
        padding: 8px;
        display: grid;
        gap: 6px;
        min-width: 150px;
        max-width: 230px;
        animation: pop 0.14s ease-out;
      }
      .card h3 {
        margin: 0;
        color: var(--gold);
        font-size: 14px;
      }
      .arrow {
        clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%);
        background: #8a4a30;
        border: 0;
        border-top: 2px solid #a35d3b;
        border-bottom: 2px solid #542a1f;
        color: var(--cream);
        padding: 8px 22px 8px 10px;
        min-height: 40px;
        min-width: 150px;
        justify-content: flex-start;
        box-shadow: none;
        animation: rise 0.2s ease-out backwards;
      }
      .arrow.left {
        clip-path: polygon(14px 0, 100% 0, 100% 100%, 14px 100%, 0 50%);
        padding: 8px 10px 8px 22px;
      }
      #tray {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: max(8px, env(safe-area-inset-bottom));
        padding: 7px;
        display: flex;
        gap: 5px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        width: max-content;
        max-width: calc(100vw - 16px);
        box-sizing: border-box;
        z-index: 6;
        animation: rise 0.18s ease-out;
      }
      #tray.drop {
        border-color: var(--coral);
      }
      #tray .note {
        width: 100%;
        text-align: center;
      }
      .slot {
        width: 44px;
        height: 50px;
        min-height: 0;
        position: relative;
        padding: 0;
      }
      .slot i {
        position: absolute;
        right: 3px;
        bottom: 0;
        font-style: normal;
        font-size: 11px;
        color: var(--gold);
      }
      .slot.none {
        opacity: 0.35;
      }
      #works {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: var(--ink);
        display: flex;
        flex-direction: column;
      }
      #works header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 10px;
        border-bottom: 2px solid var(--edge);
        background: var(--plum);
      }
      #works header b {
        color: var(--gold);
        flex: 1;
      }
      #works iframe {
        flex: 1;
        border: 0;
        width: 100%;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="tags"></div>
    <div id="bubbles"></div>
    <div id="hud">
      <div id="purse" class="panel">
        <span class="cur" id="leafBox"><b id="leaf">0</b></span>
        <span class="cur" id="coinBox"><b id="coins">0</b></span>
      </div>
      <div id="where" class="panel" hidden></div>
      <div id="mates"></div>
      <div id="btns"></div>
      <div id="feed"></div>
    </div>
    <div id="panel" class="panel" hidden>
      <header>
        <span id="picon"></span>
        <h2 id="ptitle"></h2>
        <button id="pclose" class="b ib" aria-label="Close">x</button>
      </header>
      <div id="pbody"></div>
    </div>
    <div id="tray" class="panel" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
